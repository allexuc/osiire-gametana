<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一線打尽</title>
<meta name="description" content="ノートに描いたあみだくじで、落書きの駒と文房具の付喪神が合戦するローグライク。横線を書き足して、だれがだれとぶつかるかを決めよう。放課後の教室から夜の校舎まで、全3章。">
<meta name="theme-color" content="#2456b8">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="一線打尽">
<meta property="og:description" content="ノートに描いたあみだくじで、落書きの駒と文房具の付喪神が合戦するローグライク。横線を書き足して、だれがだれとぶつかるかを決めよう。">
<meta property="og:image" content="https://allexuc.github.io/osiire-gametana/amida/og.png">
<meta property="og:url" content="https://allexuc.github.io/osiire-gametana/amida/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="一線打尽">
<meta name="twitter:description" content="ノートに描いたあみだくじで、落書きの駒と文房具の付喪神が合戦するローグライク。">
<meta name="twitter:image" content="https://allexuc.github.io/osiire-gametana/amida/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 一線打尽: ライトは大学ノート(白い紙に水色の罫線、赤青鉛筆)、ダークは黒板(深緑にチョーク) */
:root{
  --paper:#fbfbf6;--paper-2:#f0f3f5;--rule:#d5e4ef;--margin:#f0b7b2;
  --ink:#1f232b;--ink-2:#575e6b;--ink-3:#8a909a;
  --graphite:#5f6570;--print:#262a31;
  --blue:#2456b8;--blue-ink:#ffffff;--blue-soft:rgba(36,86,184,.11);
  --red:#cc392e;--red-soft:rgba(204,57,46,.11);
  --hl:#ffe04a;--hl-wash:rgba(255,222,58,.6);
  --good:#1b8550;--gold:#a8770a;
  --card:#ffffff;--edge:#cdd5de;--shade:rgba(31,35,43,.09);
  --p0:#2f6fd6;--p1:#1d9658;--p2:#df7612;--p3:#8a4fd0;--p4:#d23f7b;
  --f-hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1c3a30;--paper-2:#21453a;--rule:rgba(236,242,230,.055);--margin:rgba(244,160,146,.3);
  --ink:#eef2e9;--ink-2:#bccabc;--ink-3:#8ea294;--graphite:#d6ddd1;--print:#f5f7f0;
  --blue:#9ccaf7;--blue-ink:#0f2a20;--blue-soft:rgba(156,202,247,.15);
  --red:#f6a596;--red-soft:rgba(246,165,150,.15);--hl:#f3d85e;--hl-wash:rgba(243,216,94,.32);
  --good:#93deb0;--gold:#f0cf6b;--card:#244a3e;--edge:#3f6a5a;--shade:rgba(0,0,0,.22);
  --p0:#8cbdf7;--p1:#8ddcab;--p2:#f6b56f;--p3:#c7a6f4;--p4:#f4a0c2;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c3a30;--paper-2:#21453a;--rule:rgba(236,242,230,.055);--margin:rgba(244,160,146,.3);
  --ink:#eef2e9;--ink-2:#bccabc;--ink-3:#8ea294;--graphite:#d6ddd1;--print:#f5f7f0;
  --blue:#9ccaf7;--blue-ink:#0f2a20;--blue-soft:rgba(156,202,247,.15);
  --red:#f6a596;--red-soft:rgba(246,165,150,.15);--hl:#f3d85e;--hl-wash:rgba(243,216,94,.32);
  --good:#93deb0;--gold:#f0cf6b;--card:#244a3e;--edge:#3f6a5a;--shade:rgba(0,0,0,.22);
  --p0:#8cbdf7;--p1:#8ddcab;--p2:#f6b56f;--p3:#c7a6f4;--p4:#f4a0c2;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--paper);color:var(--ink);font:15px/1.65 var(--f-ui);-webkit-text-size-adjust:100%;
  background-image:linear-gradient(90deg,transparent 0 calc(var(--gut) - 6px),var(--margin) calc(var(--gut) - 6px) calc(var(--gut) - 5px),transparent calc(var(--gut) - 5px)),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);
  -webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100svh;padding-left:var(--gut);padding-right:var(--gut-r);padding-block:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-hand);font-weight:600;margin:0;line-height:1.3}
p{margin:0}
.btn{appearance:none;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;min-height:46px;font-weight:700;cursor:pointer;letter-spacing:.02em;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-family:var(--f-hand);font-weight:600;font-size:19px}
.btn.quiet{border-color:var(--edge);font-weight:500}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.btn.wide{width:100%}
.link{appearance:none;border:0;background:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:8px 4px;cursor:pointer;font-size:14px}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.art{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}
.art .dot{fill:currentColor;stroke:none}.art .fillink{fill:currentColor}.art .fillred{fill:var(--red);stroke:var(--red)}.art .redline{stroke:var(--red)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 上の帯 */
.hud{display:flex;align-items:center;gap:10px;min-height:44px}
.hp{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--f-hand);font-weight:600}
.hp b{font-size:17px;white-space:nowrap}
.hpbar{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;position:relative;min-width:48px;background:var(--card)}
.hpbar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(115deg,var(--red) 0 3px,transparent 3px 5px);transition:width .45s}
.yen{font-family:var(--f-hand);font-weight:600;white-space:nowrap}
.icon-btn{appearance:none;border:1.5px solid var(--edge);background:var(--card);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}
.where{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:22px}
.seals{display:flex;gap:4px;flex-wrap:wrap}
.seal{appearance:none;border:1.5px solid var(--edge);background:var(--card);border-radius:999px;font-size:11.5px;padding:1px 8px;cursor:pointer;color:var(--ink);line-height:1.6}

/* 戦闘 */
.battle{display:flex;flex-direction:column;flex:1;gap:4px}
.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.piece{appearance:none;background:none;border:0;padding:0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative;color:var(--ink)}
.tag{width:100%;max-width:68px;border:1.5px solid var(--edge);border-radius:8px;background:var(--card);padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;position:relative;box-shadow:0 1px 0 var(--shade)}
.tag::before{content:"";position:absolute;left:6px;right:6px;top:-1.5px;height:4px;border-radius:0 0 3px 3px;background:var(--pc)}
.tag .art{width:30px;height:30px;color:var(--ink)}
.tag .nm{font-family:var(--f-hand);font-weight:600;font-size:12px;line-height:1.25;white-space:nowrap}
.tag .st{font-size:11.5px;line-height:1.3;white-space:nowrap;font-weight:700}
.st .a{color:var(--blue)}.st .d{color:var(--ink-2)}
.st .up{background:var(--hl-wash);border-radius:3px;padding:0 2px}
.piece.sel .tag{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc)}
.piece .badge{position:absolute;top:-6px;right:0;font-size:10.5px;font-weight:700;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 4px;line-height:1.5}
.piece .lv{position:absolute;top:2px;left:4px;font-size:10px;font-weight:700;color:var(--gold)}
.piece .hurt{font-size:11.5px;font-weight:700;line-height:1.4;min-height:16px;color:var(--red)}
.piece .hurt.ok{color:var(--good)}
.board{position:relative;margin:0 -2px}
.board svg{display:block;width:100%;height:auto;overflow:visible}
.gap{fill:transparent;cursor:pointer}
.gap:hover{fill:var(--blue-soft)}
.post{stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.rung{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rung.ink{stroke:var(--print);stroke-width:3.4}
.rung.pencil{stroke:var(--graphite);stroke-width:3}
.rung.enemy{stroke:var(--red);stroke-width:3}
.rung.ball{stroke:var(--blue);stroke-width:2.4}
.rung.brush{stroke:var(--print);stroke-width:6}
.rung.red{stroke:var(--red);stroke-width:3;stroke-dasharray:7 4}
.rung.ruler{stroke:var(--graphite);stroke-width:3}
.wash{fill:none;stroke:var(--hl-wash);stroke-width:13;stroke-linecap:round}
.new-rung{animation:pop .35s ease-out}
@keyframes pop{from{opacity:.2}to{opacity:1}}
.ghost{fill:none;stroke:var(--red);stroke-width:2.4;stroke-dasharray:4 5;stroke-linecap:round;opacity:.9}
.xmark{stroke:var(--red);stroke-width:2.6;stroke-linecap:round}
.staple-mark{stroke:var(--print);stroke-width:2;fill:none}
.trail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.trail.on{stroke-width:5;opacity:.95}
.fx-path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.foe{appearance:none;background:none;border:0;padding:0 2px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;position:relative;min-height:100px}
.foe .card{width:100%;border:1.5px dashed var(--edge);border-radius:8px;padding:2px 2px 4px;display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--card) 70%,transparent);position:relative}
.foe.on .card{border-style:solid;background:var(--card);box-shadow:0 1px 0 var(--shade)}
.foe .art{width:32px;height:32px}
.foe .nm{font-family:var(--f-hand);font-weight:600;font-size:11.5px;line-height:1.2;text-align:center;min-height:14px;overflow:hidden;max-width:100%;white-space:nowrap;text-overflow:ellipsis}
.ehp{width:86%;height:6px;border:1.2px solid var(--ink);border-radius:4px;position:relative;overflow:hidden;margin:2px 0}
.ehp i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .4s}
.ehp s{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(115deg,var(--blue) 0 2px,transparent 2px 4px);opacity:.9}
.hpn{font-size:10.5px;color:var(--ink-2);line-height:1.2}
.intent{font-size:12px;font-weight:700;line-height:1.35;border-radius:6px;padding:0 5px;margin-top:2px;white-space:nowrap}
.intent.atk{color:var(--red);background:var(--red-soft)}
.intent.etc{color:var(--ink);background:var(--paper-2)}
.intent.def{color:var(--blue);background:var(--blue-soft)}
.foe .arrive{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;line-height:1.3;min-height:18px;margin-top:1px}
.foe .arrive i{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block}
.foe .pred{position:absolute;top:-4px;right:2px;font-size:12px;font-weight:700;color:var(--blue);background:var(--card);border-radius:6px;padding:0 3px;line-height:1.35;box-shadow:0 0 0 1px var(--edge)}
.foe .pred.kill{color:#fff;background:var(--blue)}
.foe.dead{opacity:.35}
.foe.wide{grid-column:span 2}
.empty-slot{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:18px;min-height:100px}
.empty-slot .arrive{display:flex;align-items:center;gap:3px;font-weight:700;color:var(--ink-2)}
.empty-slot .arrive i{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block}
.sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:26px;font-size:12.5px}
.sum span{border-radius:6px;padding:1px 7px;font-weight:700;background:var(--paper-2)}
.sum .give{color:var(--blue)}.sum .take{color:var(--red)}.sum .heal{color:var(--good)}
.msg{font-size:13px;color:var(--ink-2);min-height:22px;line-height:1.5}
.msg b{color:var(--ink)}
.dock{position:sticky;bottom:0;padding-top:6px;padding-bottom:4px;background:linear-gradient(180deg,transparent,var(--paper) 14px);margin-top:auto}
.pens{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pen{appearance:none;border:1.5px solid var(--edge);background:var(--card);border-radius:10px;display:flex;align-items:center;gap:4px;padding:3px 9px 3px 5px;min-height:36px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink)}
.pen .art{width:22px;height:22px;stroke-width:3}
.pen.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue);color:var(--blue)}
.pen:disabled{opacity:.4;cursor:default}
.pen em{font-style:normal;font-weight:500;color:var(--ink-2)}
.actions{display:flex;gap:8px;align-items:center}
.strokes{display:flex;align-items:center;gap:2px;font-family:var(--f-hand);font-weight:600;font-size:13px;white-space:nowrap}
.strokes .art{width:24px;height:24px;stroke-width:3}
.strokes .used{opacity:.22}
.actions .go{flex:1}
.hint{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin:4px 0;display:flex;gap:10px;align-items:flex-start}
.hint p{flex:1}
.hint .btn{min-height:36px;padding:4px 12px}
.pop{position:absolute;font-family:var(--f-hand);font-weight:600;font-size:20px;pointer-events:none;z-index:5;transform:translate(-50%,-50%);text-shadow:0 0 3px var(--paper),0 0 6px var(--paper)}
.pop.dmg{color:var(--blue)}.pop.hurt{color:var(--red)}.pop.heal{color:var(--good)}.pop.info{color:var(--ink);font-size:15px}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}

/* 道中 */
.chap{font-family:var(--f-hand);font-weight:600;font-size:20px}
.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 2px}
.lineup .piece .tag{max-width:none}
.route svg{display:block;width:100%;height:auto}
.node{cursor:default}
.node circle{fill:var(--card);stroke:var(--edge);stroke-width:1.6}
.node text{font-family:var(--f-hand);font-weight:600;font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.node.elite circle{stroke:var(--red);stroke-width:2.2}
.node.elite text{fill:var(--red)}
.node.on circle{stroke:var(--blue);stroke-width:3}
.node.done circle{fill:var(--paper-2);stroke:var(--ink-3)}
.node.done text{fill:var(--ink-3)}
.node.here circle{fill:var(--blue);stroke:var(--blue)}
.node.here text{fill:var(--blue-ink)}
.route .post{stroke-width:2;stroke:var(--print)}
.route .way{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.route .rr{stroke:var(--print);stroke-width:2.6;stroke-linecap:round}
.route .rr.me{stroke:var(--blue)}
.start{cursor:pointer}
.start rect{fill:transparent}
.start path{fill:var(--ink-3)}
.start.on path{fill:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2);margin:4px 0}
.legend b{font-family:var(--f-hand);color:var(--ink);margin-right:3px}
.next-card{border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:10px 12px;margin:6px 0;display:flex;gap:10px;align-items:center}
.next-card .stamp{width:44px;height:44px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--f-hand);font-weight:600;font-size:22px;flex:none}
.next-card p{font-size:13px;color:var(--ink-2)}
.next-card h3{font-size:17px}

/* 画面いろいろ */
.screen{display:flex;flex-direction:column;gap:12px;flex:1;padding-top:6px}
.screen>h2{font-size:24px}
.lead{color:var(--ink-2);font-size:14px}
.choice{appearance:none;width:100%;text-align:left;border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer;color:var(--ink)}
.choice:disabled{opacity:.42;cursor:default}
.choice .art{width:46px;height:46px;flex:none}
.choice .tx{flex:1;min-width:0}
.choice h3{font-size:17px}
.choice p{font-size:13px;color:var(--ink-2);line-height:1.5}
.choice .price{font-family:var(--f-hand);font-weight:600;font-size:17px;white-space:nowrap}
.choice.sold{opacity:.4;border-style:dashed}
.choice .kind{font-size:11.5px;color:var(--ink-3);display:block}
.picker{border:2px dashed var(--blue);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.picker p{font-size:13.5px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:8px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.story{font-family:var(--f-hand);font-size:17px;line-height:1.8}
.result{border-left:4px solid var(--blue);padding:4px 10px;background:var(--blue-soft);border-radius:0 8px 8px 0;font-size:14px}

/* タイトル */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:16px 0}
.title .logo{width:min(240px,64vw)}
.title h1{font-size:clamp(44px,13vw,60px);letter-spacing:.06em;line-height:1.15}
.title h1 rt{font-size:13px;letter-spacing:.3em;font-weight:400;color:var(--ink-2)}
.title .catch{font-family:var(--f-hand);font-size:18px}
.menu{display:flex;flex-direction:column;gap:10px;width:min(300px,100%)}
.menu .row{display:flex;gap:8px}.menu .row .btn{flex:1}
.foot{font-size:12px;color:var(--ink-3);text-align:center}
.ladder-logo line{stroke:var(--print);stroke-width:2.4;stroke-linecap:round}
.ladder-logo .lr{stroke:var(--graphite);stroke-width:2.4}
.ladder-logo .lh{stroke:var(--blue);stroke-width:4}
.ladder-logo .le{stroke:var(--red);stroke-width:2.4}

/* シート・トースト */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,24,30,.35)}
.sheet[hidden]{display:none}
.sheet .in{width:min(460px,100%);background:var(--paper);border-radius:16px 16px 0 0;border:2px solid var(--ink);border-bottom:0;padding-left:var(--gut);padding-right:var(--gut-r);padding-block:16px max(18px,env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:20px}
.sheet .row{display:flex;gap:10px;align-items:center}
.sheet .row .art{width:52px;height:52px;flex:none}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px}
.sheet dt{color:var(--ink-2)}.sheet dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font-size:13.5px;max-width:min(420px,92vw);text-align:center;box-shadow:0 4px 14px var(--shade)}
.toast[hidden]{display:none}
.list{display:flex;flex-direction:column;gap:6px;font-size:14px}

<body>
<main id="app" aria-live="polite"></main>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
// ==ENGINE START==
// 一線打尽のルール計算。画面には触れない。乱数はすべて run.rs(シード付き)から取る
const VERSION='0.1.0';
const COLS=5,ROWS=7,MAXHP=50,STROKES=2,CHIME=10,LEVELS=5,ROUTE_ROWS=LEVELS-1;

/* ---------- 乱数 ---------- */
function rng(run){let t=(run.rs=(run.rs+0x6D2B79F5)>>>0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function rint(run,a,b){return a+Math.floor(rng(run)*(b-a+1));}
function pick(run,arr){return arr[Math.floor(rng(run)*arr.length)];}
function shuffle(run,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng(run)*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function wpick(run,items,w){let tot=0;for(const x of items)tot+=w(x);if(tot<=0)return items[0];let r=rng(run)*tot;for(const x of items){r-=w(x);if(r<0)return x;}return items[items.length-1];}
const has=(run,k)=>run.stickers.includes(k);

/* ---------- 駒 ---------- */
// atk/def は Lv1〜3。rar 0=はじめから 1=ふつう 2=めずらしい 3=とてもめずらしい
const PIECES={
 samurai:{n:'さむらい',s:'侍',atk:[5,7,9],def:[0,0,0],rar:0},
 sumo:{n:'すもうとり',s:'力士',atk:[1,1,2],def:[5,7,9],rar:0},
 hoken:{n:'ほけんがかり',s:'保健',atk:[0,0,0],def:[0,0,0],rar:0,heal:[2,3,5]},
 ninja:{n:'にんじゃ',s:'忍者',atk:[4,5,6],def:[0,0,0],rar:1,shuriken:[3,4,6]},
 neko:{n:'まねきねこ',s:'招き猫',atk:[0,0,0],def:[2,2,2],rar:1,coin:[3,5,8]},
 yumi:{n:'ゆみとり',s:'弓取り',atk:[3,4,5],def:[0,0,0],rar:1,splash:[2,2,3]},
 yuki:{n:'ゆきだるま',s:'雪だるま',atk:[1,1,2],def:[4,5,6],rar:1,chill:1},
 kappa:{n:'かっぱ',s:'かっぱ',atk:[3,4,5],def:[2,2,2],rar:2,perTwo:[2,2,3]},
 tengu:{n:'てんぐ',s:'天狗',atk:[4,5,6],def:[1,1,1],rar:2,straight:[5,6,8]},
 kaminari:{n:'かみなりさま',s:'雷様',atk:[2,3,3],def:[0,0,0],rar:2,perRung:[2,2,3]},
 nurikabe:{n:'ぬりかべ',s:'ぬりかべ',atk:[0,0,0],def:[9,11,13],rar:2},
 daruma:{n:'だるま',s:'だるま',atk:[2,2,2],def:[3,4,5],rar:2,rise:[1,1,2]},
 iinchou:{n:'がっきゅういいん',s:'学級委員',atk:[2,3,3],def:[2,3,3],rar:2,aura:[1,1,2]},
 tanuki:{n:'たぬき',s:'たぬき',atk:[2,3,4],def:[2,3,4],rar:2,stroke:1},
 oni:{n:'あかおに',s:'赤鬼',atk:[8,10,12],def:[0,0,0],rar:3,pierce:1},
 hanabi:{n:'はなび',s:'花火',atk:[12,16,20],def:[0,0,0],rar:3,once:1},
 momo:{n:'ももたろう',s:'桃太郎',atk:[5,6,7],def:[2,3,3],rar:3,vsBig:[4,4,6]},
};
const PIECE_KEYS=Object.keys(PIECES);
function pieceDesc(k,lv){const D=PIECES[k],i=(lv||1)-1;
 if(D.heal)return`空きマスに着くとHP+${D.heal[i]}`;
 if(D.shuriken)return`空きマスに着くと、いちばん近い敵に手裏剣${D.shuriken[i]}(反撃なし)`;
 if(D.coin)return`空きマスに着くとおこづかい+${D.coin[i]}円`;
 if(D.splash)return`着いたマスの両隣の敵にも${D.splash[i]}`;
 if(D.chill)return'当たった敵の次の攻撃を半分にする';
 if(D.perTwo)return`通った横線2本ごとに攻+${D.perTwo[i]}`;
 if(D.straight)return`横線を1本も通らなければ攻+${D.straight[i]}`;
 if(D.perRung)return`通った横線1本ごとに攻+${D.perRung[i]}`;
 if(D.rise)return`攻撃を受けきると、この戦闘のあいだ守+${D.rise[i]}`;
 if(D.aura)return`両隣の列の駒の攻と守+${D.aura[i]}`;
 if(D.stroke)return'空きマスに着くと、次のターン筆+1';
 if(D.pierce)return'敵の守りを無視する';
 if(D.once)return'1回撃つと、この戦闘ではもう撃てない';
 if(D.vsBig)return`強敵とボスへの攻+${D.vsBig[i]}`;
 return '';}

/* ---------- 敵 ---------- */
// pat はくり返す予告。t: atk 攻撃 / def 守り / line 横槍 / erase 消しゴム / wipe 全部消す / staple 消せない線 / move 移動 / run 2マス移動 / summon 呼ぶ / swap 駒の並びを入れ替え / sleep 眠らせる(守りつき) / glare にらむ
const ENEMIES={
 kasu:{n:'消しカス',hp:8,pat:[{t:'atk',v:5}]},
 enpitsu:{n:'鉛筆',hp:15,pat:[{t:'atk',v:8},{t:'line',n:1}]},
 keshigomu:{n:'消しゴム',hp:16,pat:[{t:'erase'},{t:'atk',v:7}]},
 jougi:{n:'定規',hp:18,pat:[{t:'def',v:7},{t:'atk',v:11}]},
 gabyou:{n:'画びょう',hp:9,pat:[{t:'atk',v:7}],thorns:1},
 kezuri:{n:'鉛筆削り',hp:42,elite:1,pat:[{t:'atk',v:10},{t:'summon',k:'kasu',n:1}]},
 hotchkiss:{n:'ホチキス',hp:38,elite:1,pat:[{t:'staple'},{t:'atk',v:9},{t:'atk',v:9}]},
 kokuban:{n:'黒板消し',hp:70,boss:1,w:2,pat:[{t:'atk',v:8},{t:'wipe'},{t:'atk',v:11},{t:'summon',k:'kasu',n:2}]},
 dodge:{n:'ドッジボール',hp:15,pat:[{t:'atk',v:8,move:1}]},
 tobibako:{n:'跳び箱',hp:32,pat:[{t:'def',v:12},{t:'atk',v:13}]},
 ichirin:{n:'一輪車',hp:17,pat:[{t:'move'},{t:'atk',v:11}]},
 karasu:{n:'カラス',hp:12,pat:[{t:'atk',v:5}],steal:3},
 tetsubou:{n:'鉄棒',hp:25,pat:[{t:'swap'},{t:'atk',v:9}]},
 oonawa:{n:'大縄',hp:60,elite:1,w:2,pat:[{t:'atk',v:10},{t:'def',v:13},{t:'atk',v:12}]},
 scoop:{n:'砂場のスコップ',hp:46,elite:1,pat:[{t:'line',n:2},{t:'atk',v:14}]},
 chourei:{n:'朝礼台',hp:100,boss:1,w:2,pat:[{t:'sleep',v:13},{t:'atk',v:10},{t:'summon',k:'karasu',n:1},{t:'atk',v:12}]},
 jintai:{n:'動く人体模型',hp:33,pat:[{t:'atk',v:10},{t:'move'}]},
 beethoven:{n:'ベートーベンの肖像',hp:26,pat:[{t:'glare'},{t:'atk',v:9}]},
 gaikotsu:{n:'理科室のがいこつ',hp:21,pat:[{t:'atk',v:9}],revive:6},
 kaidan:{n:'十三階段',hp:36,pat:[{t:'atk',v:8,grow:1,cap:16}]},
 piano:{n:'ひとりでに鳴るピアノ',hp:28,pat:[{t:'line',n:2},{t:'atk',v:8}]},
 kagami:{n:'合わせ鏡',hp:17,pat:[{t:'atk',v:7}],reflect:0.25},
 ninomiya:{n:'二宮金次郎像',hp:69,elite:1,pat:[{t:'run'},{t:'atk',v:15},{t:'def',v:16}]},
 hanako:{n:'トイレの花子さん',hp:44,elite:1,pat:[{t:'atk',v:12,move:1}],hide3:1},
 nanatsume:{n:'七つ目の不思議',hp:150,boss:1,w:2,phases:[
  {n:'鏡の姿',pat:[{t:'atk',v:10},{t:'def',v:12}],reflect:0.25},
  {n:'階段の姿',pat:[{t:'atk',v:9,grow:2,cap:20}]},
  {n:'黒板の姿',pat:[{t:'wipe'},{t:'atk',v:14}]}]},
};
const CHAPTERS=[
 {n:'放課後の教室',hpM:1,atkM:1,first:[['kasu','kasu'],['kasu','enpitsu'],['gabyou','kasu']],
  normal:[['kasu','kasu','enpitsu'],['enpitsu','keshigomu'],['jougi','kasu','kasu'],['gabyou','gabyou','kasu'],['keshigomu','jougi'],['enpitsu','gabyou','kasu'],['enpitsu','enpitsu']],
  elite:[['kezuri'],['hotchkiss','kasu']],boss:[['kokuban']]},
 {n:'夕焼けの校庭',hpM:1,atkM:1,
  normal:[['dodge','karasu','karasu'],['tobibako','karasu','karasu'],['ichirin','dodge','karasu'],['tetsubou','karasu','dodge'],['ichirin','tobibako'],['tetsubou','ichirin','karasu'],['dodge','dodge','karasu']],
  elite:[['oonawa'],['scoop','karasu']],boss:[['chourei']]},
 {n:'夜の校舎',hpM:1,atkM:1,
  normal:[['jintai','gaikotsu','kagami'],['beethoven','kagami','gaikotsu'],['kaidan','kagami','gaikotsu'],['piano','jintai'],['beethoven','piano','kagami'],['gaikotsu','gaikotsu','kagami'],['jintai','kaidan']],
  elite:[['ninomiya'],['hanako','kagami']],boss:[['nanatsume']]},
];

/* ---------- ペンとシール ---------- */
const PENS={
 hl:{n:'蛍光ペン',d:'この線を通った駒は攻+2',u:1},
 brush:{n:'筆ペン',d:'この線を通った駒は守+2',u:1},
 ball:{n:'ボールペン',d:'筆を使わずに引ける。敵に消されない',u:2},
 red:{n:'赤ペン',d:'一方通行。駒は曲がるが、敵の攻撃はまっすぐ通り抜ける',u:1},
 ruler:{n:'定規',d:'となりの縦線をまたいで、2つ先とつなぐ長い線',u:1},
 tape:{n:'修正テープ',d:'印刷の線も含めて1本消す。筆を使わない',u:1},
};
const PEN_KEYS=Object.keys(PENS);
const STICKERS={
 janken:{n:'じゃんけん',d:'駒と敵にグー・チョキ・パーがつく。勝つ相手には攻2倍、負ける相手には半分',g:1,p:80},
 korogashi:{n:'鉛筆転がし',d:'毎ターン鉛筆を転がし、出た目(1〜5)の列の駒が攻+4。6なら全員+1',g:1,p:70},
 marubatsu:{n:'〇×ゲーム',d:'隣り合う3マスの敵にまとめて当てると、その敵に追加4ダメージ',g:1,p:70},
 acchimuite:{n:'あっち向いてホイ',d:'出発した列からずれた列の数だけ攻+',g:1,p:80},
 daruma_s:{n:'だるまさんがころんだ',d:'動いたばかりの敵に当てると攻2倍',g:1,p:60},
 sekigae:{n:'席替え',d:'戦闘ごとに1回、隣り合う駒2つを筆を使わずに入れ替えられる',g:1,p:70},
 domino:{n:'ドミノ倒し',d:'敵を倒したとき、余ったダメージが隣の敵に入る',g:1,p:70},
 otoshi:{n:'消しゴム落とし',d:'はしのマス(1番・5番)の敵は、HPが3割を切ると落ちる',g:1,p:70},
 fukuwarai:{n:'福笑い',d:'毎ターンのはじめに敵の並びが入れ替わる。そのかわり敵のHPが2割へる',g:1,p:60},
 kakurenbo:{n:'かくれんぼ',d:'毎ターン駒が1つ隠れ、その駒への攻撃は外れる',g:1,p:80},
 yobi:{n:'予備の鉛筆',d:'1ターン目だけ筆+2',g:2,p:60},
 shitajiki:{n:'下じき',d:'敵の横槍が入らない',g:2,p:60},
 cap:{n:'鉛筆キャップ',d:'自分の引いた線が敵に消されない',g:2,p:60},
 sharpen:{n:'シャーペン',d:'毎ターン1回、筆を使わずに線を消せる',g:2,p:80},
 akamaru:{n:'赤丸',d:'線を1本も引かなかったターンの次は筆+2',g:2,p:60},
 randoseru:{n:'ランドセル',d:'ペンの使える回数+1',g:2,p:70},
 hanamaru:{n:'はなまる',d:'敵を倒すたびにおこづかい+3円',g:3,p:60},
 nafuda:{n:'名札',d:'左はしの駒の攻+3',g:3,p:70},
 uwabaki:{n:'上履き',d:'1ターン目は全員の攻+3',g:3,p:70},
 toban:{n:'給食当番の帽子',d:'戦闘に勝つとHP+4',g:3,p:70},
 renraku:{n:'連絡帳',d:'強敵とボスの最初のターン、敵の攻撃が0',g:3,p:70},
 taisou:{n:'体操服',d:'HPの最大+10',g:3,p:80},
 hata:{n:'学級旗',d:'5つの駒がすべて違う種類なら、全員の攻と守+1',g:3,p:70},
 origami:{n:'金の折り紙',d:'購買部の値段が2割引き',g:3,p:60},
};
const STICKER_KEYS=Object.keys(STICKERS);
const GAKKYU={
 ichi:{n:'1年1組',d:'侍2・力士2・保健係。まずはここから',pieces:['samurai','sumo','hoken','sumo','samurai'],pens:[],stickers:[]},
 zukou:{n:'図工クラブ',d:'雷様が入り、蛍光ペンと定規を持って出発',pieces:['samurai','sumo','kaminari','sumo','samurai'],pens:['hl','ruler'],stickers:[],unlock:1},
 nicchoku:{n:'日直当番',d:'忍者と招き猫が入り、はなまるのシールつき',pieces:['ninja','sumo','neko','sumo','samurai'],pens:[],stickers:['hanamaru'],unlock:2},
};

/* ---------- ラン ---------- */
function newRun(seed,gk){gk=GAKKYU[gk]?gk:'ichi';const G=GAKKYU[gk];
 const run={v:1,seed:seed>>>0,rs:seed>>>0,gk,ch:0,hp:MAXHP,maxHp:MAXHP,money:0,pieces:[],pens:G.pens.slice(),stickers:[],flags:{buff:0,stroke:0},
  stats:{battles:0,kills:0,maxHit:0,turns:0,taken:0,elites:0},seen:[],phase:'map',b:null,map:null,reward:null,shop:null,ev:null,msg:''};
 for(const k of G.pieces)addPiece(run,k,-1);
 for(const s of G.stickers)addSticker(run,s);
 genMap(run);return run;}
function addPiece(run,k,idx){const p={k,lv:1};if(has(run,'janken'))p.rps=rint(run,0,2);
 if(idx>=0&&idx<run.pieces.length)run.pieces[idx]=p;else run.pieces.push(p);return p;}
function addSticker(run,k){if(!STICKERS[k]||has(run,k))return;run.stickers.push(k);
 if(k==='taisou'){run.maxHp+=10;run.hp+=10;}
 if(k==='janken')for(const p of run.pieces)if(p.rps==null)p.rps=rint(run,0,2);}
function heal(run,n){run.hp=Math.min(run.maxHp,run.hp+n);}
function randPiece(run,w,excl){excl=excl||[];const ks=PIECE_KEYS.filter(k=>PIECES[k].rar>0&&!excl.includes(k));return wpick(run,ks,k=>w[PIECES[k].rar]);}
function randPen(run,excl){excl=excl||[];const ks=PEN_KEYS.filter(k=>!run.pens.includes(k)&&!excl.includes(k));return ks.length?pick(run,ks):null;}
function stickerOpts(run,n){return shuffle(run,STICKER_KEYS.filter(k=>!has(run,k))).slice(0,n);}

/* ---------- 道中あみだ ---------- */
function genMap(run){const nodes=[Array(COLS).fill('battle')];
 for(let tries=0;tries<80;tries++){
  const bag=['elite','elite',rng(run)<0.5?'elite':'event','event','event','shop','shop','rest','treasure'];
  while(bag.length<15)bag.push('battle');const sh=shuffle(run,bag);
  if(sh.slice(0,5).includes('elite'))continue;
  const lv=[sh.slice(0,5),sh.slice(5,10),sh.slice(10,15)];
  if(lv.some(l=>l.filter(x=>x==='battle'||x==='elite').length<1))continue;
  nodes.push(...lv);break;}
 if(nodes.length<4)nodes.push(['battle','event','battle','shop','battle'],['elite','battle','event','battle','rest'],['battle','treasure','elite','battle','event']);
 nodes.push(shuffle(run,['rest','rest','rest','shop','shop']));
 const rungs=[];
 for(let r=0;r<ROUTE_ROWS;r++){const n=rint(run,1,2);for(let i=0;i<n;i++){const free=[];for(let a=0;a<COLS-1;a++)if(!rungs.some(g=>g.r===r&&g.a<=a+1&&g.b>=a))free.push(a);if(free.length){const a=pick(run,free);rungs.push({r,a,b:a+1});}}}
 run.map={nodes,rungs,lvl:-1,col:-1,pencil:1,done:[]};run.phase='map';}
function routeNext(map,r,c){for(const g of map.rungs)if(g.r===r){if(g.a===c)return g.b;if(g.b===c)return g.a;}return c;}
function routePath(map,start){const cols=[start];let c=start;for(let r=0;r<ROUTE_ROWS;r++){c=routeNext(map,r,c);cols.push(c);}return cols;}
function routeCanPut(map,r,a){if(r<0||r>=ROUTE_ROWS||a<0||a>=COLS-1)return false;if(map.lvl>=0&&r<map.lvl)return false;return!map.rungs.some(g=>g.r===r&&g.a<=a+1&&g.b>=a);}
function routePencil(run,r,a){const m=run.map;if(m.pencil<1||!routeCanPut(m,r,a))return false;m.rungs.push({r,a,b:a+1,me:1});m.pencil--;return true;}
function chooseStart(run,col){const m=run.map;if(m.lvl!==-1)return false;m.col=col;m.lvl=0;enterNode(run);return true;}
function advance(run){const m=run.map;if(run.phase!=='map'||m.lvl<0)return false;
 if(m.lvl>=LEVELS-1){m.lvl=LEVELS;startBattle(run,'boss');return true;}
 m.col=routeNext(m,m.lvl,m.col);m.lvl++;enterNode(run);return true;}
function enterNode(run){const m=run.map,t=m.nodes[m.lvl][m.col];m.done.push([m.lvl,m.col]);run.msg='';
 if(t==='battle'||t==='elite')startBattle(run,t==='elite'?'elite':'normal');
 else if(t==='shop')genShop(run);
 else if(t==='rest')run.phase='rest';
 else if(t==='event')startEvent(run);
 else if(t==='treasure'){run.reward={money:0,opts:[],stickers:stickerOpts(run,2),treasure:1};run.phase='reward';}}
function nodeDone(run){run.phase='map';run.reward=null;run.shop=null;run.ev=null;}

/* ---------- 戦闘: 盤 ---------- */
function canPut(b,r,a,bb,reserved){if(r<0||r>=ROWS||a<0||bb>=COLS||a>=bb)return false;
 for(const g of b.rungs)if(g.r===r&&g.a<=bb&&g.b>=a)return false;
 if(reserved)for(const p of reserved)if(p.r===r&&p.a<=bb&&p.a+1>=a)return false;return true;}
function addRung(b,g){g.id=b.uid++;b.rungs.push(g);return g;}
function removeRung(b,id){b.rungs=b.rungs.filter(x=>x.id!==id);}
function freePositions(b,reserved){const out=[];for(let r=0;r<ROWS;r++)for(let a=0;a<COLS-1;a++)if(canPut(b,r,a,a+1,reserved))out.push({r,a});return out;}
function enemyCanErase(run,g){return g.k!=='ink'&&g.k!=='ball'&&!(g.me&&has(run,'cap'));}
function paths(b){const at=new Int16Array(ROWS*COLS).fill(-1);b.rungs.forEach((g,i)=>{at[g.r*COLS+g.a]=i;at[g.r*COLS+g.b]=i;});
 const down=[],cross=[],up=[];
 for(let c0=0;c0<COLS;c0++){let c=c0;const cr=[];for(let r=0;r<ROWS;r++){const i=at[r*COLS+c];if(i>=0){const g=b.rungs[i];cr.push(g);c=g.a===c?g.b:g.a;}}down.push(c);cross.push(cr);}
 for(let c0=0;c0<COLS;c0++){let c=c0;for(let r=ROWS-1;r>=0;r--){const i=at[r*COLS+c];if(i>=0){const g=b.rungs[i];if(g.k!=='red')c=g.a===c?g.b:g.a;}}up.push(c);}
 return{down,up,cross};}
// 駒の道すじ(描画用): 各段の通過後の列
function route(b,c0){const cols=[c0];let c=c0;for(let r=0;r<ROWS;r++){const g=b.rungs.find(x=>x.r===r&&(x.a===c||x.b===c));if(g)c=g.a===c?g.b:g.a;cols.push(c);}return cols;}
function routeUp(b,s0){const cols=[s0];let c=s0;for(let r=ROWS-1;r>=0;r--){const g=b.rungs.find(x=>x.r===r&&(x.a===c||x.b===c));if(g&&g.k!=='red')c=g.a===c?g.b:g.a;cols.push(c);}return cols.reverse();}

/* ---------- 戦闘: 敵 ---------- */
function phaseOf(e){const D=ENEMIES[e.k];if(!D.phases)return 0;const f=e.hp/e.max;return f>2/3?0:f>1/3?1:2;}
function patOf(e){const D=ENEMIES[e.k];return D.phases?D.phases[e.phase||0].pat:D.pat;}
function reflectOf(e){const D=ENEMIES[e.k];return D.phases?(D.phases[e.phase||0].reflect||0):(D.reflect||0);}
function enemyName(e){const D=ENEMIES[e.k];return D.phases?D.n+'('+D.phases[e.phase||0].n+')':D.n;}
function occupancy(b){const occ=Array(COLS).fill(null);for(const e of b.en)if(e.hp>0)for(let s=0;s<e.w;s++)occ[e.slot+s]=e;return occ;}
function freeSlots(b,excl){const occ=occupancy(b);const out=[];for(let s=0;s<COLS;s++)if(!occ[s]&&!(excl&&excl.includes(s)))out.push(s);return out;}
function spawn(run,b,k,slot){const D=ENEMIES[k];let hp=Math.round(D.hp*(CHAPTERS[run.ch].hpM||1));if(has(run,'fukuwarai'))hp=Math.max(1,Math.ceil(hp*0.8));
 const e={id:b.uid++,k,hp,max:hp,slot,w:D.w||1,step:0,buff:0,grow:0,chill:false,moved:false,revived:false,phase:0,intent:null};
 if(!D.boss&&!D.elite&&D.pat.length>1)e.step=rint(run,0,D.pat.length-1);
 if(has(run,'janken'))e.rps=rint(run,0,2);b.en.push(e);return e;}
function atkVal(b,e){const it=e.intent;if(!it||it.t!=='atk')return 0;let v=Math.round(it.v*(b.atkM||1))+(e.buff||0)+(e.grow||0);if(it.cap)v=Math.min(v,Math.round(it.cap*(b.atkM||1)));
 const ct=b.kind==='boss'?CHIME+4:CHIME;if(b.turn>ct)v+=2*(b.turn-ct);if(b.noAtk)v=0;return v;}
function pickSlot(run,b,e,dist,taken){if(e.w>1)return null;const fs=freeSlots(b,taken).filter(s=>s!==e.slot);if(!fs.length)return null;
 const exact=fs.filter(s=>Math.abs(s-e.slot)===dist);if(exact.length)return pick(run,exact);
 const near=fs.filter(s=>Math.abs(s-e.slot)<=dist);if(near.length)return pick(run,near);return dist>1?pick(run,fs):null;}
function revealIntents(run,b){const res=[],moves=[];
 for(const e of b.en.slice().sort((x,y)=>x.slot-y.slot)){if(e.hp<=0)continue;const pat=patOf(e);const it=Object.assign({},pat[e.step%pat.length]);
  if(it.t==='line'||it.t==='staple'){it.pos=[];for(let i=0;i<(it.n||1);i++){const fp=freePositions(b,res);if(!fp.length)break;const p=pick(run,fp);it.pos.push(p);res.push(p);}}
  if(it.t==='erase'){const c=b.rungs.filter(g=>enemyCanErase(run,g));const mine=c.filter(g=>g.me);it.target=c.length?pick(run,mine.length?mine:c).id:0;}
  if(it.t==='move'||it.move||it.t==='run'){it.to=pickSlot(run,b,e,it.t==='run'?2:1,moves);if(it.to!=null)moves.push(it.to);}
  if(it.t==='swap')it.c=rint(run,0,COLS-2);
  e.intent=it;}}
function shuffleEnemies(run,b){const movers=b.en.filter(e=>e.hp>0&&e.w===1);if(movers.length<1)return;
 const big=b.en.filter(e=>e.hp>0&&e.w>1);const slots=[];for(let s=0;s<COLS;s++)if(!big.some(e=>s>=e.slot&&s<e.slot+e.w))slots.push(s);
 const sh=shuffle(run,slots);movers.forEach((e,i)=>{if(e.slot!==sh[i]){e.slot=sh[i];}});}

/* ---------- 戦闘: はじまりとターン ---------- */
function startBattle(run,kind){const C=CHAPTERS[run.ch];let group;
 if(kind==='normal'&&run.stats.battles===0&&C.first)group=pick(run,C.first);else group=pick(run,C[kind]);
 const b={kind,turn:0,rungs:[],uid:1,en:[],lineup:[0,1,2,3,4],ps:run.pieces.map(()=>({sleep:0,stun:0,used:false,rise:0})),
  strokes:0,penUses:{},edits:[],nextStroke:0,drew:0,freeErase:0,sekigae:has(run,'sekigae')?1:0,noAtk:false,roll:0,hidden:-1,
  allDiff:new Set(run.pieces.map(p=>p.k)).size===run.pieces.length,over:false,won:false,atkM:C.atkM||1};
 for(const p of run.pens)b.penUses[p]=PENS[p].u+(has(run,'randoseru')?1:0);
 run.b=b;
 const big=group.filter(k=>(ENEMIES[k].w||1)>1),small=group.filter(k=>(ENEMIES[k].w||1)===1);
 for(const k of big)spawn(run,b,k,rint(run,1,2));
 for(const k of small){const fs=freeSlots(b);if(fs.length)spawn(run,b,k,pick(run,fs));}
 const n=kind==='normal'?4:5;for(let i=0;i<n;i++){const fp=freePositions(b);if(!fp.length)break;const p=pick(run,fp);addRung(b,{r:p.r,a:p.a,b:p.a+1,k:'ink'});}
 run.phase='battle';startTurn(run);return b;}
function startTurn(run){const b=run.b;b.turn++;b.edits=[];b.drew=0;b.freeErase=0;
 b.strokes=STROKES+b.nextStroke+(run.flags.stroke||0)+(b.turn===1&&has(run,'yobi')?2:0);b.nextStroke=0;
 b.noAtk=b.turn===1&&b.kind!=='normal'&&has(run,'renraku');
 b.roll=has(run,'korogashi')?rint(run,1,6):0;
 b.hidden=has(run,'kakurenbo')?rint(run,0,COLS-1):-1;
 if(has(run,'fukuwarai')&&b.turn>1)shuffleEnemies(run,b);
 revealIntents(run,b);}

/* ---------- 戦闘: 線を書く・消す ---------- */
function drawRung(run,r,a,pen){const b=run.b;pen=pen||'pencil';const span=pen==='ruler'?2:1,free=pen==='ball';
 if(pen==='tape')return{ok:false,why:'修正テープは消すときに使う'};
 if(a+span>=COLS)a=COLS-1-span;
 if(pen!=='pencil'&&!(b.penUses[pen]>0))return{ok:false,why:'このペンはもう使えない'};
 if(!free&&b.strokes<1)return{ok:false,why:'筆が残っていない'};
 if(!canPut(b,r,a,a+span))return{ok:false,why:'となりの線とくっつくので引けない'};
 const g=addRung(b,{r,a,b:a+span,k:pen,me:true,t:b.turn});if(!free)b.strokes--;if(pen!=='pencil')b.penUses[pen]--;b.drew++;
 b.edits.push({t:'draw',id:g.id,pen,free});return{ok:true,g};}
function eraseRung(run,id,pen){const b=run.b;const g=b.rungs.find(x=>x.id===id);if(!g)return{ok:false,why:'線がない'};
 const ei=b.edits.findIndex(x=>x.t==='draw'&&x.id===id);
 if(ei>=0){const ed=b.edits[ei];b.edits.splice(ei,1);removeRung(b,id);if(!ed.free)b.strokes++;if(ed.pen!=='pencil')b.penUses[ed.pen]++;b.drew--;return{ok:true,undo:true};}
 if(pen==='tape'){if(!(b.penUses.tape>0))return{ok:false,why:'修正テープはもう使えない'};b.penUses.tape--;removeRung(b,id);b.edits.push({t:'erase',g,pen:'tape'});return{ok:true};}
 if(g.k==='ink')return{ok:false,why:g.staple?'ホチキスの線は消せない':'印刷の線は消せない'};
 const free=has(run,'sharpen')&&!b.freeErase;
 if(!free&&b.strokes<1)return{ok:false,why:'筆が残っていない'};
 if(free)b.freeErase=1;else b.strokes--;
 removeRung(b,id);b.edits.push({t:'erase',g,free});return{ok:true};}
function undo(run){const b=run.b;const ed=b.edits.pop();if(!ed)return false;
 if(ed.t==='draw'){removeRung(b,ed.id);if(!ed.free)b.strokes++;if(ed.pen!=='pencil')b.penUses[ed.pen]++;b.drew--;}
 else if(ed.t==='erase'){if(!canPut(b,ed.g.r,ed.g.a,ed.g.b)){b.edits.push(ed);return false;}b.rungs.push(ed.g);
  if(ed.pen==='tape')b.penUses.tape++;else if(ed.free)b.freeErase=0;else b.strokes++;}
 else if(ed.t==='seki'){const t=b.lineup[ed.c];b.lineup[ed.c]=b.lineup[ed.c+1];b.lineup[ed.c+1]=t;b.sekigae++;}
 return true;}
function sekigae(run,c){const b=run.b;if(!(b.sekigae>0)||c<0||c>=COLS-1)return false;const t=b.lineup[c];b.lineup[c]=b.lineup[c+1];b.lineup[c+1]=t;b.sekigae--;b.edits.push({t:'seki',c});return true;}
// ボットと画面の見込み用: いま取れる手
function actions(run){const b=run.b,acts=[];
 for(let r=0;r<ROWS;r++)for(let a=0;a<COLS-1;a++){if(b.strokes>0&&canPut(b,r,a,a+1))acts.push({t:'draw',r,a,pen:'pencil'});
   for(const p of run.pens){if(p==='tape'||!(b.penUses[p]>0)||(b.strokes<1&&p!=='ball'))continue;const span=p==='ruler'?2:1;if(a+span<COLS&&canPut(b,r,a,a+span))acts.push({t:'draw',r,a,pen:p});}}
 if(b.strokes>0||(has(run,'sharpen')&&!b.freeErase))for(const g of b.rungs)if(g.k!=='ink'&&!b.edits.some(x=>x.t==='draw'&&x.id===g.id))acts.push({t:'erase',id:g.id});
 if(b.penUses.tape>0)for(const g of b.rungs)if(!b.edits.some(x=>x.t==='draw'&&x.id===g.id))acts.push({t:'erase',id:g.id,pen:'tape'});
 return acts;}
function doAction(run,a){return a.t==='draw'?drawRung(run,a.r,a.a,a.pen):eraseRung(run,a.id,a.pen);}

/* ---------- 戦闘: 駒の強さ ---------- */
function pieceStats(run,b,c,P){const pi=b.lineup[c],pc=run.pieces[pi],D=PIECES[pc.k],i=pc.lv-1,ps=b.ps[pi];
 let atk=D.atk[i],def=D.def[i];const cr=P.cross[c],n=cr.length;
 if(D.perRung)atk+=D.perRung[i]*n;
 if(D.perTwo)atk+=D.perTwo[i]*Math.floor(n/2);
 if(D.straight&&n===0)atk+=D.straight[i];
 for(const g of cr){if(g.k==='hl')atk+=2;if(g.k==='brush')def+=2;}
 for(const nc of[c-1,c+1]){if(nc<0||nc>=COLS)continue;const q=run.pieces[b.lineup[nc]],QD=PIECES[q.k];if(QD.aura){atk+=QD.aura[q.lv-1];def+=QD.aura[q.lv-1];}}
 if(c===0&&has(run,'nafuda'))atk+=3;
 if(b.turn===1&&has(run,'uwabaki'))atk+=3;
 if(b.roll){if(b.roll===c+1)atk+=4;else if(b.roll===6)atk+=1;}
 if(has(run,'acchimuite'))atk+=Math.abs(P.down[c]-c);
 if(b.allDiff&&has(run,'hata')){atk+=1;def+=1;}
 if(run.flags.buff)atk+=run.flags.buff;
 def+=ps.rise;let state='';
 if(D.once&&ps.used){atk=0;state='used';}
 if(ps.sleep>0){atk=0;state='sleep';}
 if(ps.stun>0){atk=0;def=0;state='stun';}
 return{atk,def,state,D,pi,i,k:pc.k};}
const emptySkill=D=>!!(D.heal||D.coin||D.stroke||D.shuriken);
const rpsWin=(a,b)=>a==null||b==null?0:a===b?0:(a+1)%3===b?1:-1; // 0グー 1チョキ 2パー: グーはチョキに勝つ

/* ---------- 戦闘: せーの(見込みにも使う。b を書き換えない) ---------- */
function clash(run,b){const P=paths(b);
 const X=b.en.map(e=>({e,hp:e.hp,blk:0,alive:e.hp>0,chill:e.chill,chillUsed:false,revived:e.revived}));
 const occ=Array(COLS).fill(-1);X.forEach((x,i)=>{if(x.alive)for(let s=0;s<x.e.w;s++)occ[x.e.slot+s]=i;});
 for(const x of X){const it=x.e.intent;if(x.alive&&it&&(it.t==='def'||it.t==='sleep'))x.blk=Math.round(it.v*(b.atkM||1));}
 const R={P,acts:[],dealt:0,kills:[],heal:0,money:0,taken:0,stroke:0,thorns:0,reflect:0,steal:0,attacks:[],rise:[],used:[],big:0,revive:[],drops:0,marubatsu:false,X,occ,extra:[]};
 const near=(s)=>{let best=null,bd=99;for(const x of X){if(!x.alive)continue;for(let k=0;k<x.e.w;k++){const d=Math.abs(x.e.slot+k-s);if(d<bd){bd=d;best=x;}}}return best;};
 const nextTo=(x)=>{let best=null,bd=99;for(const y of X){if(!y.alive||y===x)continue;const d=y.e.slot>=x.e.slot?y.e.slot-x.e.slot:(x.e.slot-y.e.slot)+0.5;if(d<bd){bd=d;best=y;}}return best;};
 const damage=(x,d,pierce,src)=>{if(!x||!x.alive||d<=0)return 0;let dd=d;if(!pierce){const ab=Math.min(x.blk,dd);x.blk-=ab;dd-=ab;}if(dd<=0)return 0;
  const before=x.hp;x.hp-=dd;R.dealt+=Math.min(dd,before);
  if(x.hp>0&&has(run,'otoshi')&&x.e.w===1&&(x.e.slot===0||x.e.slot===COLS-1)&&x.hp<x.e.max*0.3){x.hp=0;R.drops++;}
  if(x.hp<=0){const D=ENEMIES[x.e.k];
   if(D.revive&&!x.revived){x.revived=true;x.hp=D.revive;R.revive.push(x.e.id);}
   else{x.alive=false;R.kills.push(x.e.id);if(has(run,'hanamaru'))R.money+=3;
    const over=dd-before;if(over>0&&has(run,'domino')){const y=nextTo(x);if(y){const dmg=damage(y,over,true,'domino');R.extra.push({t:'domino',from:x.e.id,to:y.e.id,dmg});}}}}
  return dd;};
 const slotHit=Array(COLS).fill(false);
 // 応援: 敵のいないマスに着いた駒(空きマスの特技がない駒)の数だけ、敵に当たる駒のうち攻がいちばん高い1つ(同じなら左)の攻が増える
 const STS=[];let cheer=0;for(let c=0;c<COLS;c++){const st=pieceStats(run,b,c,P);STS.push(st);if(occ[P.down[c]]<0&&!st.state&&!emptySkill(st.D))cheer++;}
 let star=-1;for(let c=0;c<COLS;c++){const st=STS[c];if(occ[P.down[c]]<0||st.state)continue;if(star<0||st.atk>STS[star].atk)star=c;}
 R.cheer=cheer;R.star=star;
 for(let c=0;c<COLS;c++){const st=STS[c],s=P.down[c],xi=occ[s],x=xi>=0?X[xi]:null;
  const act={c,slot:s,k:st.k,pi:st.pi,atk:st.atk,def:st.def,state:st.state,target:x?x.e.id:0,dmg:0,kind:''};
  if(st.state==='stun'){act.kind='stun';R.acts.push(act);continue;}
  if(x&&x.alive){
   let a=st.atk;if(c===star)a+=cheer;
   if(ENEMIES[x.e.k].hide3&&x.e.slot!==2&&a>0){a=Math.floor(a/2);act.hide=1;}
   if(st.D.vsBig&&(ENEMIES[x.e.k].elite||ENEMIES[x.e.k].boss))a+=st.D.vsBig[st.i];
   if(has(run,'janken')&&a>0){const w=rpsWin(run.pieces[st.pi].rps,x.e.rps);act.rps=w;if(w>0)a*=2;else if(w<0)a=Math.floor(a/2);}
   if(has(run,'daruma_s')&&x.e.moved&&a>0){a*=2;act.daruma=1;}
   act.kind='hit';act.atk=a;
   if(a>0){const d=damage(x,a,!!st.D.pierce);act.dmg=d;R.big=Math.max(R.big,d);slotHit[s]=true;
    if(d>0&&ENEMIES[x.e.k].thorns)R.thorns+=ENEMIES[x.e.k].thorns;
    const rf=reflectOf(x.e);if(rf&&d>0)R.reflect+=Math.floor(d*rf);}
   if(st.D.chill&&x.alive){x.chill=true;act.chill=1;}
   if(st.D.splash){act.splash=[];for(const ns of[s-1,s+1]){if(ns<0||ns>=COLS)continue;const yi=occ[ns];if(yi>=0&&yi!==xi&&X[yi].alive){const d=damage(X[yi],st.D.splash[st.i],true);act.splash.push({id:X[yi].e.id,dmg:d});}}}
   if(st.D.once&&st.atk>0)R.used.push(st.pi);
  }else{act.kind='empty';
   if(!st.state){
    if(st.D.heal){R.heal+=st.D.heal[st.i];act.heal=st.D.heal[st.i];}
    if(st.D.coin){R.money+=st.D.coin[st.i];act.coin=st.D.coin[st.i];}
    if(st.D.stroke){R.stroke+=1;act.stroke=1;}
    if(st.D.shuriken){const t=near(s);if(t){const d=damage(t,st.D.shuriken[st.i],false);act.shuriken={id:t.e.id,dmg:d};}}
   }}
  R.acts.push(act);}
 if(has(run,'marubatsu'))for(let s=0;s+2<COLS;s++){if(slotHit[s]&&slotHit[s+1]&&slotHit[s+2]){const set=new Set();for(let k=s;k<s+3;k++){const xi=occ[k];if(xi>=0&&X[xi].alive)set.add(xi);}
   for(const xi of set){const d=damage(X[xi],4,true);R.extra.push({t:'marubatsu',to:X[xi].e.id,dmg:d});}R.marubatsu=true;break;}}
 for(const x of X){if(!x.alive)continue;const it=x.e.intent;if(!it||it.t!=='atk')continue;
  let v=atkVal(b,x.e);if(x.chill&&v>0){v=Math.floor(v/2);x.chillUsed=true;}
  for(let k=0;k<x.e.w;k++){const s=x.e.slot+k,c=P.up[s],st=pieceStats(run,b,c,P);
   const a={id:x.e.id,slot:s,c,pi:st.pi,v,def:st.def,taken:0,miss:false};
   if(b.hidden===c)a.miss=true;
   else{a.taken=Math.max(0,v-st.def);R.taken+=a.taken;if(a.taken===0&&v>0&&st.D.rise)R.rise.push({pi:st.pi,v:st.D.rise[st.i]});
    if(a.taken>0&&ENEMIES[x.e.k].steal)R.steal+=ENEMIES[x.e.k].steal;}
   R.attacks.push(a);}}
 R.taken+=R.thorns+R.reflect;R.won=X.every(x=>!x.alive);return R;}

function commit(run){const b=run.b;if(!b||b.over)return null;const R=clash(run,b);
 for(const x of R.X){const e=x.e;e.hp=Math.max(0,x.hp);e.revived=x.revived;e.chill=x.chillUsed?false:x.chill;}
 for(const pi of R.used)b.ps[pi].used=true;
 for(const r of R.rise)b.ps[r.pi].rise+=r.v;
 heal(run,R.heal);run.money+=R.money;
 run.hp-=R.taken;run.stats.taken+=R.taken;run.stats.turns++;
 if(R.won&&run.hp<1)run.hp=1; // 最後の敵を倒したターンは、トゲや鏡の返しでは倒れない
 if(R.steal)run.money=Math.max(0,run.money-R.steal);
 b.nextStroke+=R.stroke;run.stats.kills+=R.kills.length;run.stats.maxHit=Math.max(run.stats.maxHit,R.big);
 if(R.won){winBattle(run);return R;}
 if(run.hp<=0){run.hp=0;b.over=true;run.phase='over';return R;}
 R.after=endOfTurn(run,b,R);
 b.en=b.en.filter(e=>e.hp>0);
 if(!b.en.length){winBattle(run);return R;}
 startTurn(run);return R;}
function endOfTurn(run,b,R){const log=[];
 for(const ps of b.ps){if(ps.sleep>0)ps.sleep--;if(ps.stun>0)ps.stun--;}
 for(const e of b.en)e.moved=false;
 const slotFree=(s,e)=>!b.en.some(o=>o!==e&&o.hp>0&&s>=o.slot&&s<o.slot+o.w);
 for(const e of b.en.slice().sort((x,y)=>x.slot-y.slot)){if(e.hp<=0)continue;const it=e.intent;if(!it)continue;
  if(it.t==='line'){if(has(run,'shitajiki'))log.push({t:'blocked',id:e.id});else for(const p of it.pos){if(canPut(b,p.r,p.a,p.a+1)){addRung(b,{r:p.r,a:p.a,b:p.a+1,k:'enemy'});log.push({t:'line',id:e.id,r:p.r,a:p.a});}else log.push({t:'blocked',id:e.id});}}
  else if(it.t==='staple'){for(const p of it.pos)if(canPut(b,p.r,p.a,p.a+1)){addRung(b,{r:p.r,a:p.a,b:p.a+1,k:'ink',staple:1});log.push({t:'staple',id:e.id,r:p.r,a:p.a});}}
  else if(it.t==='erase'){let g=it.target?b.rungs.find(x=>x.id===it.target):null;if(!g||!enemyCanErase(run,g)){const mine=b.rungs.filter(x=>x.me&&enemyCanErase(run,x));g=mine.length?mine[mine.length-1]:null;}
   if(g&&enemyCanErase(run,g)){removeRung(b,g.id);log.push({t:'erase',id:e.id,r:g.r,a:g.a,b:g.b});}}
  else if(it.t==='wipe'){const n=b.rungs.filter(g=>enemyCanErase(run,g)).length;b.rungs=b.rungs.filter(g=>!enemyCanErase(run,g));log.push({t:'wipe',id:e.id,n});}
  else if(it.t==='move'||it.t==='run'||(it.t==='atk'&&it.move)){if(it.to!=null&&slotFree(it.to,e)){log.push({t:'move',id:e.id,from:e.slot,to:it.to});e.slot=it.to;e.moved=true;}}
  else if(it.t==='summon'){for(let i=0;i<(it.n||1);i++){const fs=freeSlots(b);if(!fs.length)break;const ne=spawn(run,b,it.k,pick(run,fs));log.push({t:'summon',id:e.id,nid:ne.id,slot:ne.slot});}}
  else if(it.t==='swap'){const t=b.lineup[it.c];b.lineup[it.c]=b.lineup[it.c+1];b.lineup[it.c+1]=t;log.push({t:'swap',id:e.id,c:it.c});}
  else if(it.t==='sleep'||it.t==='glare'){for(let c=0;c<COLS;c++){const s=R.P.down[c];if(s>=e.slot&&s<e.slot+e.w){const ps=b.ps[b.lineup[c]];if(it.t==='sleep')ps.sleep=1;else ps.stun=1;log.push({t:it.t,id:e.id,c});}}}
  if(it.t==='atk'&&it.grow)e.grow+=it.grow;}
 for(const e of b.en)if(e.hp>0){e.step++;if(ENEMIES[e.k].phases){const p=phaseOf(e);if(p!==e.phase){e.phase=p;e.step=0;log.push({t:'phase',id:e.id,p});}}}
 if(b.drew===0&&has(run,'akamaru'))b.nextStroke+=2;
 return log;}
function winBattle(run){const b=run.b;b.over=true;b.won=true;run.stats.battles++;if(b.kind==='elite')run.stats.elites++;
 if(has(run,'toban'))heal(run,4);
 run.flags.buff=0;run.flags.stroke=0;
 const k=b.kind;const m=k==='boss'?50:k==='elite'?rint(run,20,30):rint(run,8,15);run.money+=m;
 run.reward={money:m,opts:rewardOpts(run,k),stickers:k==='normal'?null:stickerOpts(run,k==='boss'?3:2),kind:k};
 if(k==='boss')run.hp+=Math.ceil((run.maxHp-run.hp)/2);
 run.phase='reward';}
function rewardOpts(run,kind){const w=kind==='normal'?[0,10,5,1]:kind==='elite'?[0,5,8,3]:[0,2,7,6];
 const p1=randPiece(run,w),p2=randPiece(run,w,[p1]);const opts=[{t:'piece',k:p1},{t:'piece',k:p2}];
 const pen=run.pens.length<3?randPen(run):null;
 if(pen&&rng(run)<0.5)opts.push({t:'pen',k:pen});else opts.push({t:'train'});return opts;}
// i: 選んだ番号(-1で飛ばす)。arg: 交代する駒・特訓する駒・入れ替えるペンの番号
function takeReward(run,i,arg){const R=run.reward;if(!R||R.took)return false;
 if(i>=0){const o=R.opts[i];if(!o)return false;
  if(o.t==='piece'){if(!(arg>=0&&arg<run.pieces.length))return false;addPiece(run,o.k,arg);}
  else if(o.t==='train'){const p=run.pieces[arg];if(!p||p.lv>=3)return false;p.lv++;}
  else if(o.t==='pen'){if(run.pens.length<3)run.pens.push(o.k);else{if(!(arg>=0&&arg<3))return false;run.pens[arg]=o.k;}}}
 R.took=true;if(!R.stickers||R.stickerTook)finishReward(run);return true;}
function takeSticker(run,i){const R=run.reward;if(!R||!R.stickers||R.stickerTook)return false;if(i>=0){const k=R.stickers[i];if(!k)return false;addSticker(run,k);}
 R.stickerTook=true;if(R.took||!R.opts.length)finishReward(run);return true;}
function finishReward(run){const R=run.reward;run.reward=null;run.b=null;
 if(R&&R.kind==='boss'){if(run.ch>=CHAPTERS.length-1){run.phase='clear';return;}run.ch++;genMap(run);run.phase='chapter';return;}
 nodeDone(run);}

function price(run,p){return Math.round(p*(has(run,'origami')?0.8:1));}
function genShop(run){const items=[];const w=[0,8,6,2];
 const p1=randPiece(run,w),p2=randPiece(run,w,[p1]);for(const k of[p1,p2])items.push({t:'piece',k,price:price(run,[0,40,55,80][PIECES[k].rar])});
 const pen=randPen(run);if(pen)items.push({t:'pen',k:pen,price:price(run,50)});
 for(const k of stickerOpts(run,2))items.push({t:'sticker',k,price:price(run,STICKERS[k].p)});
 items.push({t:'bread',price:price(run,25)});items.push({t:'train',price:price(run,50)});
 run.shop={items};run.phase='shop';}
function buy(run,i,arg){const it=run.shop&&run.shop.items[i];if(!it||it.sold||run.money<it.price)return false;
 if(it.t==='piece'){if(!(arg>=0&&arg<run.pieces.length))return false;addPiece(run,it.k,arg);}
 else if(it.t==='pen'){if(run.pens.length<3)run.pens.push(it.k);else{if(!(arg>=0&&arg<3))return false;run.pens[arg]=it.k;}}
 else if(it.t==='sticker')addSticker(run,it.k);
 else if(it.t==='bread'){if(run.hp>=run.maxHp)return false;heal(run,10);}
 else if(it.t==='train'){const p=run.pieces[arg];if(!p||p.lv>=3)return false;p.lv++;}
 run.money-=it.price;it.sold=true;return true;}
function rest(run,what,arg){if(run.phase!=='rest')return false;
 if(what==='heal')heal(run,Math.ceil(run.maxHp*0.3));
 else if(what==='train'){const p=run.pieces[arg];if(!p||p.lv>=3)return false;p.lv++;}
 else return false;nodeDone(run);return true;}
function swapLineup(run,i,j){if(i===j||!run.pieces[i]||!run.pieces[j])return false;const t=run.pieces[i];run.pieces[i]=run.pieces[j];run.pieces[j]=t;return true;}

/* ---------- 戦闘の盤 ---------- */
const BW=360,CW=72,TP=8;let RH=38,BH=TP*2+ROWS*RH;
// 盤の段の高さを画面の高さに合わせる(縦横の比は保ったまま、ほかの部品が1画面に収まるように)
function fitBoard(){const W=Math.min(460,innerWidth)-28,other=470+(meta.tut<3?78:0)+((run&&run.b&&(run.pens.length||run.b.sekigae))?44:0);
 const avail=Math.max(196,Math.min(330,innerHeight-other));RH=Math.max(26,Math.min(44,((avail-16)/ROWS)*BW/W));BH=TP*2+ROWS*RH;}
const bx=c=>36+CW*c,by=r=>TP+RH*(r+.5);
function rungAt(rungs,r,c){return rungs.find(x=>x.r===r&&(x.a===c||x.b===c));}
function trailD(rungs,c0){let c=c0,d=`M${bx(c)} 0`;for(let r=0;r<ROWS;r++){const g=rungAt(rungs,r,c);if(g){const n=g.a===c?g.b:g.a;d+=`L${bx(c)} ${by(r)}L${bx(n)} ${by(r)}`;c=n;}}return d+`L${bx(c)} ${BH}`;}
function upD(rungs,s0){let c=s0,d=`M${bx(c)} ${BH}`;for(let r=ROWS-1;r>=0;r--){const g=rungAt(rungs,r,c);if(g&&g.k!=='red'){const n=g.a===c?g.b:g.a;d+=`L${bx(c)} ${by(r)}L${bx(n)} ${by(r)}`;c=n;}}return d+`L${bx(c)} 0`;}
function rungD(g){const y=by(g.r),x1=bx(g.a),x2=bx(g.b);
 if(g.b-g.a===2){const xm=bx(g.a+1);return`M${x1} ${y}L${xm-10} ${y}Q${xm} ${y-14} ${xm+10} ${y}L${x2} ${y}`;}
 const w=(((g.id||1)*37)%5-2)*0.7;return`M${x1} ${y}Q${(x1+x2)/2} ${y+w} ${x2} ${y}`;}
function rungSVG(g,flash){const cls=g.k==='ruler'?'ruler':g.k;let s='';
 if(g.k==='hl')s+=`<path class="wash" d="${rungD(g)}"/>`;
 s+=`<path class="rung ${g.k==='hl'?'pencil':cls}${flash?' new-rung':''}" d="${rungD(g)}"/>`;
 const xm=(bx(g.a)+bx(g.b))/2,y=by(g.r);
 if(g.k==='red')s+=`<path d="M${xm-5} ${y-5}L${xm+5} ${y-5}L${xm} ${y+3}z" fill="var(--red)"/>`;
 if(g.staple)s+=`<path class="staple-mark" d="M${bx(g.a)+8} ${y-6}v-4h10v4M${bx(g.b)-18} ${y-6}v-4h10v4"/>`;
 return s;}
function boardSVG(b,R,opts){opts=opts||{};let s=`<svg viewBox="0 0 ${BW} ${BH}" id="boardsvg" role="img" aria-label="あみだくじの盤">`;
 for(let c=0;c<COLS;c++)s+=`<line class="post" x1="${bx(c)}" y1="0" x2="${bx(c)}" y2="${BH}"/>`;
 // 駒ごとの道すじ
 for(let c=0;c<COLS;c++)s+=`<path class="trail${ui.sel===c?' on':''}" style="stroke:var(--p${c})" d="${trailD(b.rungs,c)}"/>`;
 for(const g of b.rungs)s+=rungSVG(g,g.id===ui.flash);
 // 敵の予告(盤への悪さ)
 for(const e of b.en){if(e.hp<=0||!e.intent)continue;const it=e.intent;
  if((it.t==='line'||it.t==='staple')&&it.pos)for(const p of it.pos)s+=`<path class="ghost" ${it.t==='staple'?'style="stroke:var(--print)"':''} d="M${bx(p.a)} ${by(p.r)}L${bx(p.a+1)} ${by(p.r)}"/>`;
  if(it.t==='erase'){const g=b.rungs.find(x=>x.id===it.target);if(g){const xm=(bx(g.a)+bx(g.b))/2,y=by(g.r);s+=`<path class="xmark" d="M${xm-6} ${y-6}l12 12M${xm+6} ${y-6}l-12 12"/>`;}}
  if(it.t==='wipe')for(const g of b.rungs){if(g.k==='ink'||g.k==='ball'||(g.me&&has(run,'cap')))continue;const xm=(bx(g.a)+bx(g.b))/2,y=by(g.r);s+=`<path class="xmark" d="M${xm-5} ${y-5}l10 10M${xm+5} ${y-5}l-10 10"/>`;}}
 if(!opts.still)for(let r=0;r<ROWS;r++)for(let a=0;a<COLS-1;a++)s+=`<rect class="gap" data-act="gap" data-r="${r}" data-a="${a}" x="${bx(a)+4}" y="${by(r)-RH/2}" width="${CW-8}" height="${RH}" rx="6"><title>${r+1}段目・${a+1}と${a+2}の間</title></rect>`;
 s+=`<g id="fx"></g></svg>`;return s;}

/* ---------- 戦闘の画面 ---------- */
function intentInfo(b,e){const it=e.intent;if(!it)return{t:'',c:'etc',d:''};const m=v=>Math.round(v*(b.atkM||1));
 switch(it.t){
  case'atk':{let v=atkVal(b,e);const ch=e.chill&&v>0;if(ch)v=Math.floor(v/2);const two=e.w>1?'(2マス)':'';
   return{t:`攻撃${v}${e.w>1?'×2':''}${it.move?'・移動':''}`,c:'atk',d:`${v}ダメージの攻撃${two}。同じ線を上って、着いた駒が受ける${ch?'(こごえで半分)':''}${it.move?'。攻撃のあと動く':''}`};}
  case'def':return{t:`守り${m(it.v)}`,c:'def',d:`このターン、受けるダメージを${m(it.v)}減らす`};
  case'line':return{t:`横槍${it.n>1?'×'+it.n:''}`,c:'etc',d:'ターンの終わりに、点線の場所へ赤い線を引く。先にすぐ隣へ線を引いておけば防げる'};
  case'erase':return{t:'消しゴム',c:'etc',d:'ターンの終わりに、×の線を消す(印刷の線は消さない)'};
  case'wipe':return{t:'全部消す',c:'etc',d:'ターンの終わりに、鉛筆と赤鉛筆の線を全部消す'};
  case'staple':return{t:'ホチキス',c:'etc',d:'ターンの終わりに、点線の場所へ消せない線を打つ'};
  case'move':return{t:'移動',c:'etc',d:'ターンの終わりに、となりの空きマスへ動く'};
  case'run':return{t:'走る',c:'etc',d:'ターンの終わりに、2マス先へ走る'};
  case'summon':return{t:'仲間を呼ぶ',c:'etc',d:`ターンの終わりに、空きマスへ${ENEMIES[it.k].n}を呼ぶ`};
  case'swap':return{t:'逆上がり',c:'etc',d:`ターンの終わりに、${it.c+1}番目と${it.c+2}番目の駒の並びを入れ替える`};
  case'sleep':return{t:`長い話・守り${m(it.v)}`,c:'def',d:`このターン守り${m(it.v)}。ターンの終わりに、ここに着いた駒を眠らせる(次のターン攻0)`};
  case'glare':return{t:'にらむ',c:'etc',d:'ターンの終わりに、ここに着いた駒をにらむ(次のターン攻も守も0)'};}
 return{t:'',c:'etc',d:''};}
function pieceNote(c,R){const act=R.acts[c],out=[];
 const hits=R.attacks.filter(a=>a.c===c);
 for(const a of hits){if(a.miss)out.push('<span class="hurt ok">かくれた</span>');else if(a.taken>0)out.push(`<span class="hurt">−${a.taken}</span>`);else out.push('<span class="hurt ok">防ぐ</span>');}
 if(!hits.length&&act){if(act.heal)out.push(`<span class="hurt ok">HP+${act.heal}</span>`);else if(act.coin)out.push(`<span class="hurt ok">+${act.coin}円</span>`);else if(act.shuriken)out.push(`<span class="hurt ok">手裏剣</span>`);else if(act.stroke)out.push('<span class="hurt ok">筆+1</span>');
  else if(act.kind==='empty'&&!act.state&&R.cheer)out.push('<span class="hurt ok">応援</span>');}
 return out.join('')||'<span class="hurt"></span>';}
function battleView(){fitBoard();const b=run.b,R=clash(run,b),P=R.P;ui.R=R;
 const tags=b.lineup.map((pi,c)=>{const p=run.pieces[pi],D=PIECES[p.k],st=pieceStats(run,b,c,P),act=R.acts[c];
  const atk=act.kind==='hit'?act.atk:st.atk,up=atk>D.atk[p.lv-1],dup=st.def>D.def[p.lv-1];
  const badge=st.state==='sleep'?'眠り':st.state==='stun'?'動けない':st.state==='used'?'使った':b.hidden===c?'かくれ':'';
  const rps=p.rps!=null&&has(run,'janken')?`<span class="hpn">${RPS[p.rps]}</span>`:'';
  return`<button class="piece${ui.sel===c?' sel':''}" id="pc${c}" data-act="bpiece" data-c="${c}" style="--pc:var(--p${c})" aria-label="${esc(D.n)}">
  <div class="tag">${p.lv>1?`<span class="lv">Lv${p.lv}</span>`:''}${badge?`<span class="badge">${badge}</span>`:''}${art(p.k)}<span class="nm">${esc(D.s)}</span><span class="st"><span class="a${up?' up':''}">攻${atk}</span> <span class="d${dup?' up':''}">守${st.def}</span></span>${rps}</div>${pieceNote(c,R)}</button>`;}).join('');
 // 敵の列
 const occ=Array(COLS).fill(null);for(const e of b.en)if(e.hp>0)for(let s=0;s<e.w;s++)occ[e.slot+s]=e;
 const arrive=s=>{const c=P.down.indexOf(s);return`<i style="--pc:var(--p${c})"></i>${esc(PIECES[run.pieces[b.lineup[c]].k].s)}`;};
 let foes='';for(let s=0;s<COLS;s++){const e=occ[s];
  if(!e){foes+=`<div class="empty-slot" data-s0="${s}" data-w="1" style="grid-column:${s+1}">空き<span class="arrive">${arrive(s)}</span></div>`;continue;}
  if(e.slot!==s)continue;
  const x=R.X.find(q=>q.e===e),after=Math.max(0,x?x.hp:e.hp),lost=e.hp-after,ii=intentInfo(b,e),dead=x&&!x.alive;
  const arr=[];for(let k=0;k<e.w;k++)arr.push(arrive(s+k));
  foes+=`<button class="foe on" data-act="foe" data-id="${e.id}" data-s0="${s}" data-w="${e.w}" style="grid-column:${s+1} / span ${e.w}" aria-label="${esc(enemyName(e))} HP${e.hp}">
  <div class="card">${lost>0||dead?`<span class="pred${dead?' kill':''}">${dead?'たおす':'−'+lost}</span>`:''}${art(e.k)}<span class="nm">${esc(enemyName(e))}</span>
  <div class="ehp" style="width:${e.w>1?'92%':'86%'}"><i style="width:${100*after/e.max}%"></i><s style="left:${100*after/e.max}%;width:${100*lost/e.max}%"></s></div><span class="hpn">${e.hp}/${e.max}${e.chill?' こごえ':''}${e.rps!=null&&has(run,'janken')?' '+RPS[e.rps]:''}</span>
  <span class="intent ${ii.c}">${esc(ii.t)}</span></div><span class="arrive">${arr.join(' ')}</span></button>`;}

function swappedNames(before,after){const ch=[];for(let c=0;c<COLS;c++)if(before[c]!==after[c])ch.push(c);
 return ch.map(c=>PIECES[run.pieces[run.b.lineup[c]].k].s).join('と');}
function tapGap(r,a){const b=run.b,before=paths(b).down.slice();
 const g=b.rungs.find(x=>x.r===r&&x.a<=a&&x.b>=a+1);
 if(g){const res=eraseRung(run,g.id,ui.pen==='tape'?'tape':undefined);
  if(!res.ok){ui.msg=esc(res.why);}
  else{const nm=swappedNames(before,paths(b).down);ui.msg=res.undo?`線を取り消した${nm?`。${esc(nm)}の行き先が戻った`:''}`:`線を消した${nm?`。${esc(nm)}の行き先が入れ替わった`:''}`;if(ui.pen==='tape')ui.pen='pencil';}}
 else{if(ui.pen==='tape'){ui.msg='修正テープは、消したい線をタップして使う';render();return;}
  const res=drawRung(run,r,a,ui.pen);
  if(!res.ok)ui.msg=esc(res.why);
  else{ui.flash=res.g.id;const nm=swappedNames(before,paths(b).down);ui.msg=nm?`<b>${esc(nm)}</b>の行き先が入れ替わった`:'線を引いた';if(ui.pen!=='pencil'&&!(b.penUses[ui.pen]>0))ui.pen='pencil';}}
 save();render();ui.flash=0;}
function trailFor(c){return trailD(run.b.rungs,c);}
async function doCommit(){if(ui.busy||!run.b)return;ui.busy=true;
 const snap=JSON.parse(JSON.stringify(run.b)),names={};for(const e of snap.en)names[e.id]=enemyName(e);
 const lineupNames=snap.lineup.map(pi=>PIECES[run.pieces[pi].k].s);
 const R=commit(run);
 for(const e of(run.b?run.b.en:[]))names[e.id]=names[e.id]||enemyName(e);
 try{await animateClash(snap,R);}catch(e){}
 meta.maxHit=Math.max(meta.maxHit,R.big||0);
 ui.busy=false;ui.pen='pencil';ui.sel=-1;ui.seki=false;
 if(run.phase==='battle'){ui.msg=afterText(R.after||[],names,lineupNames,R)||'';}
 else ui.msg='';
 if(run.phase==='over')endRun();
 save();mark();render();}
function afterText(log,names,ln,R){const out=[];
 if(R.taken>0&&R.reflect)out.push(`鏡の返しで${R.reflect}ダメージ`);
 for(const l of log){const n=esc(names[l.id]||'敵');
  if(l.t==='line')out.push(`${n}が横槍の線を引いた`);else if(l.t==='blocked')out.push(`${n}の横槍は入らなかった`);
  else if(l.t==='erase')out.push(`${n}が線を1本消した`);else if(l.t==='wipe')out.push(`${n}が線を${l.n}本消した`);
  else if(l.t==='staple')out.push(`${n}が消せない線を打った`);else if(l.t==='move')out.push(`${n}が動いた`);
  else if(l.t==='summon')out.push(`${n}が仲間を呼んだ`);else if(l.t==='swap')out.push(`${n}の逆上がりで、駒の並びが入れ替わった`);
  else if(l.t==='sleep')out.push(`長い話で${esc(ln[l.c])}が眠ってしまった`);else if(l.t==='glare')out.push(`${esc(ln[l.c])}がにらまれて動けない`);
  else if(l.t==='phase')out.push(`${n}の姿が変わった`);}
 const uniq=[...new Set(out)];return uniq.join('。')+(uniq.length?'。':'');}
function slotEl(s){for(const el of document.querySelectorAll('.foes [data-s0]')){const s0=+el.dataset.s0,w=+el.dataset.w;if(s>=s0&&s<s0+w)return el;}return null;}
function pop(el,text,cls){if(!el)return;const host=$('#battle');if(!host)return;const hr=host.getBoundingClientRect(),r=el.getBoundingClientRect();
 const d=document.createElement('div');d.className='pop '+cls;d.textContent=text;d.style.left=(r.left-hr.left+r.width/2)+'px';d.style.top=(r.top-hr.top+Math.min(r.height*0.4,40))+'px';host.appendChild(d);
 const dur=Math.max(650,1000*(SPD()||0.6));d.animate([{transform:'translate(-50%,-20%)',opacity:0},{transform:'translate(-50%,-60%)',opacity:1,offset:.18},{transform:'translate(-50%,-130%)',opacity:0}],{duration:dur,easing:'ease-out'}).onfinish=()=>d.remove();}
function trace(d,color,dur){const svg=$('#boardsvg');if(!svg)return Promise.resolve();const fx=svg.querySelector('#fx');const p=document.createElementNS(SVGNS,'path');p.setAttribute('d',d);p.setAttribute('class','fx-path');p.style.stroke=color;fx.appendChild(p);
 const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
 if(!dur){p.style.strokeDashoffset=0;return Promise.resolve();}
 return p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,easing:'ease-in-out',fill:'forwards'}).finished;}
async function animateClash(snap,R){const sp=SPD();
 document.querySelectorAll('.gap').forEach(g=>g.remove());
 const go=$('[data-act="go"]');if(go)go.disabled=true;
 if(sp){const ps=[];for(let c=0;c<COLS;c++){const st=R.acts[c];if(st&&st.kind==='stun')continue;ps.push(trace(trailD(snap.rungs,c),`var(--p${c})`,650*sp));}await Promise.all(ps);}
 for(const a of R.acts){const el=slotEl(a.slot);
  if(a.kind==='hit'){if(a.dmg>0)pop(el,`−${a.dmg}`,'dmg');else pop(el,'防がれた','info');}
  else if(a.kind==='empty'){if(a.heal)pop($('#hpbar'),`+${a.heal}`,'heal');else if(a.coin)pop(document.querySelector('.yen'),`+${a.coin}円`,'heal');else if(a.shuriken){pop(slotEl(snap.en.find(e=>e.id===a.shuriken.id)?.slot??a.slot),`−${a.shuriken.dmg}`,'dmg');}}
  if(a.splash)for(const sp2 of a.splash){const e=snap.en.find(x=>x.id===sp2.id);if(e)pop(slotEl(e.slot),`−${sp2.dmg}`,'dmg');}}
 for(const x of R.extra||[]){const e=snap.en.find(q=>q.id===x.to);if(e)pop(slotEl(e.slot),`−${x.dmg}`,'dmg');}
 for(const id of R.kills){const e=snap.en.find(x=>x.id===id);const el=e&&slotEl(e.slot);if(el)el.classList.add('dead');}
 if(sp)await sleep(420*sp);
 if(R.attacks.length){if(sp){await Promise.all(R.attacks.map(a=>trace(upD(snap.rungs,a.slot),'var(--red)',480*sp)));}
  for(const a of R.attacks){const el=$('#pc'+a.c);if(a.miss)pop(el,'かわした','info');else if(a.taken>0)pop(el,`−${a.taken}`,'hurt');else pop(el,'防いだ','heal');}
  if(R.taken>0){const hb=$('#hpbar');if(hb){hb.classList.remove('shake');void hb.offsetWidth;hb.classList.add('shake');}}
  if(sp)await sleep(560*sp);}
 else if(sp)await sleep(200*sp);
 if(R.won){toast('勝った!');if(sp)await sleep(300*sp);}}

function routeD(m,c,from){let d=`M${mx(c)} ${from<0?14:LY(from)}`;const start=Math.max(0,from);if(from<0)d+=`L${mx(c)} ${LY(0)}`;
 for(let l=start;l<LEVELS-1;l++){const n=routeNext(m,l,c);d+=`L${mx(c)} ${RY(l)}L${mx(n)} ${RY(l)}L${mx(n)} ${LY(l+1)}`;c=n;}return d+`L${mx(c)} ${BOSSY-20}`;}

 let s=`<svg viewBox="0 0 ${MW} ${MH}" role="img" aria-label="道中あみだ">`;
 for(let c=0;c<COLS;c++)s+=`<line class="post" x1="${mx(c)}" y1="14" x2="${mx(c)}" y2="${BOSSY-20}"/>`;
 if(sc>=0)s+=`<path class="way" d="${routeD(m,sc,started?m.lvl:-1)}"/>`;
 for(const g of m.rungs)s+=`<line class="rr${g.me?' me':''}" x1="${mx(g.a)}" y1="${RY(g.r)}" x2="${mx(g.b)}" y2="${RY(g.r)}"/>`;
 const onPath=new Set();if(sc>=0){let c=sc;for(let l=Math.max(0,started?m.lvl:0);l<LEVELS;l++){onPath.add(l+':'+c);if(l<LEVELS-1)c=routeNext(m,l,c);}}
 const done=new Set(m.done.map(([l,c])=>l+':'+c));
 for(let l=0;l<LEVELS;l++)for(let c=0;c<COLS;c++){const t=m.nodes[l][c],k=l+':'+c;
  const cls=['node',t==='elite'?'elite':'',done.has(k)?'done':'',started&&l===m.lvl&&c===m.col?'here':'',onPath.has(k)&&!(started&&l===m.lvl)?'on':''].filter(Boolean).join(' ');
  s+=`<g class="${cls}" data-act="node" data-l="${l}" data-c="${c}" style="cursor:pointer"><circle cx="${mx(c)}" cy="${LY(l)}" r="17"/><text x="${mx(c)}" y="${LY(l)+1}">${NODE_CH[t]}</text><title>${NODE_NAME[t]}</title></g>`;}
 s+=`<g class="node${started?'':''}"><rect x="12" y="${BOSSY-18}" width="${MW-24}" height="40" rx="12" fill="var(--card)" stroke="var(--red)" stroke-width="2.2"/><text x="${MW/2}" y="${BOSSY+2}" style="fill:var(--red)">ボス: ${esc(ENEMIES[BOSS_OF[run.ch]].n)}</text></g>`;
 if(!started)for(let c=0;c<COLS;c++)s+=`<g class="start${ui.mapStart===c?' on':''}" data-act="start" data-c="${c}"><rect x="${mx(c)-30}" y="0" width="60" height="${LY(0)+18}"/><path d="M${mx(c)-8} 6h16l-8 10z"/></g>`;
 if(ui.mapPencil&&m.pencil>0)for(let r=Math.max(0,m.lvl);r<ROUTE_ROWS;r++)for(let a=0;a<COLS-1;a++){if(!routeCanPut(m,r,a))continue;s+=`<rect class="gap" data-act="rgap" data-r="${r}" data-a="${a}" x="${mx(a)+18}" y="${RY(r)-14}" width="${MCW-36}" height="28" rx="6" style="fill:var(--blue-soft)"/>`;}
 s+=`</svg>`;
 let next='';
 if(!started){if(ui.mapStart<0)next=`<div class="next-card"><div class="stamp">↓</div><div><h3>出発する縦線をえらぶ</h3><p>上の▼をタップすると、通るマスが光る。</p></div></div>`;
  else{const t=m.nodes[0][ui.mapStart];next=`<div class="next-card"><div class="stamp">${NODE_CH[t]}</div><div><h3>最初は${NODE_NAME[t]}</h3><p>この線を下りていく。</p></div></div>`;}}
 else{const atBoss=m.lvl>=LEVELS-1;const nc=atBoss?-1:routeNext(m,m.lvl,m.col),t=atBoss?'boss':m.nodes[m.lvl+1][nc];
  next=`<div class="next-card"><div class="stamp" style="${t==='elite'||t==='boss'?'color:var(--red)':''}">${NODE_CH[t]}</div><div><h3>次は${NODE_NAME[t]}${t==='boss'?`: ${esc(ENEMIES[BOSS_OF[run.ch]].n)}`:''}</h3><p>${esc(nodeHint(t))}</p></div></div>`;}
 const pencilBtn=m.pencil>0?`<button class="btn quiet${ui.mapPencil?' on':''}" data-act="mpencil" aria-pressed="${ui.mapPencil}">${ui.mapPencil?'やめる':'道中の鉛筆'} <em style="font-style:normal">${m.pencil}</em></button>`:'';

 return`<div class="screen" style="gap:4px">${hud()}<div class="where"><span class="chap">${run.ch+1}章 ${esc(CHAPTERS[run.ch].n)}</span>${sealRow()}</div>

function pickDone(arg){const p=ui.pick;if(!p)return;let ok=false;
 if(p.need==='train'&&run.pieces[arg]&&run.pieces[arg].lv>=3){toast('この駒はもうLv3');return;}
 if(p.from==='reward')ok=takeReward(run,p.i,arg);
 else if(p.from==='shop')ok=buy(run,p.i,arg);
 else if(p.from==='rest')ok=rest(run,'train',arg);
 else if(p.from==='event')ok=chooseEvent(run,p.i,arg);
 ui.pick=null;if(!ok){toast('えらべなかった');render();return;}
 if(p.from==='shop'){toast('買った');save();render();return;}
 if(p.from==='event'){save();render();return;}
 if(run.phase==='reward'){save();render();return;}
 afterNode();}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||ui.busy)return;const f=ACT[t.dataset.act];if(!f)return;e.preventDefault();f(t.dataset,t);});
sheetEl.addEventListener('click',e=>{if(e.target===sheetEl){closeSheet();return;}const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t);}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheetEl.hidden)closeSheet();});
if(run&&run.phase!=='over'&&run.phase!=='clear')shelfMark(`${run.ch+1}章・${CHAPTERS[run.ch].n}`,true);
render();

</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
