<style>
body{margin:0}
/* Layout: one 480px column on a gingham tablecloth; the card tower is the centerpiece, crayon doodles and hand-lettered sound effects carry the chaos */
:root{
  --cloth:#e6ecf7;--cloth-a:rgba(44,80,170,.12);--cloth-b:rgba(44,80,170,.06);
  --ink:#1b2133;--ink-2:#576079;--panel:rgba(255,255,255,.9);--panel-edge:#c8d1e5;--sheet:#f6f8fd;--slot:rgba(87,96,121,.4);
  --paper:#fffdf6;--paper-edge:#d7d0bf;--on-paper:#2a2f3d;--suit-red:#c22f29;--suit-black:#1a1c23;--joker:#5a3db5;--dust-bg:#d8d4cb;--dust-ink:#6f6b62;--back-a:#2c54c8;--back-b:#e9eefb;
  --accent:#2c54c8;--accent-ink:#ffffff;--accent-soft:rgba(44,84,200,.12);
  --gold:#d6950f;--gold-ink:#241800;--hp:#d0433a;--heal:#21835a;--warn:#d9730f;--warn-ink:#1d1206;--info:#4b5cc9;--boom:rgba(255,138,31,.95);--boom-2:rgba(255,138,31,.4);
  --dd-bomb:#d8432c;--dd-wing:#2f86d1;--dd-crown:#a87400;--dd-spring:#1f8f55;--dd-twin:#7d45c4;--dd-clone:#cf3f73;
  --f-disp:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-hand:"Yusei Magic","Hiragino Maru Gothic ProN","Zen Kaku Gothic New",system-ui,sans-serif;
  --cw:min(70px,calc((100vw - 32px - 24px) / 4));--ch:calc(var(--cw) * 1.18);
  --hw:min(66px,calc((100vw - 32px - 28px) / 5));--hh:calc(var(--hw) * 1.38);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cloth:#11172a;--cloth-a:rgba(120,150,235,.09);--cloth-b:rgba(120,150,235,.045);--ink:#e8ecf6;--ink-2:#9ea8c0;--panel:rgba(24,31,52,.92);--panel-edge:#33405f;--sheet:#182035;--slot:rgba(160,172,205,.38);--paper:#f1ebde;--paper-edge:#bfb7a4;--accent:#7d9bff;--accent-ink:#0b1020;--accent-soft:rgba(125,155,255,.16);--gold:#f0b23a;--hp:#ff6b5f;--heal:#4cc58c;--warn:#ff9d45;--info:#9ba9ff;color-scheme:dark}}
:root[data-theme="dark"]{--cloth:#11172a;--cloth-a:rgba(120,150,235,.09);--cloth-b:rgba(120,150,235,.045);--ink:#e8ecf6;--ink-2:#9ea8c0;--panel:rgba(24,31,52,.92);--panel-edge:#33405f;--sheet:#182035;--slot:rgba(160,172,205,.38);--paper:#f1ebde;--paper-edge:#bfb7a4;--accent:#7d9bff;--accent-ink:#0b1020;--accent-soft:rgba(125,155,255,.16);--gold:#f0b23a;--hp:#ff6b5f;--heal:#4cc58c;--warn:#ff9d45;--info:#9ba9ff;color-scheme:dark}
html,body{height:100%}
body{background-color:var(--cloth);background-image:repeating-linear-gradient(0deg,var(--cloth-a) 0 13px,transparent 13px 26px),repeating-linear-gradient(90deg,var(--cloth-b) 0 13px,transparent 13px 26px);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 18px;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:700;cursor:pointer;letter-spacing:.02em}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.hot{border-color:var(--hp);color:var(--hp)}
.btn:disabled{opacity:.4;cursor:default}
.wide{width:100%}
.btn:focus-visible,.slot:focus-visible,.tw:focus-visible,.hc:focus-visible,.node:focus-visible,.link:focus-visible,.row-btn:focus-visible,.as-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.link{appearance:none;border:0;background:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:6px 4px;cursor:pointer;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--panel-edge);border-radius:12px}
.hud{display:flex;align-items:center;gap:8px;padding:8px 10px}
.hpbox{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
.bar{position:relative;flex:1;height:8px;border-radius:5px;background:var(--slot);overflow:hidden;min-width:40px}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--hp);border-radius:5px;transition:width .4s}
.num{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--panel-edge);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.grd{color:var(--info)}.chip.brc{color:var(--warn)}
.as-btn{appearance:none;background:var(--panel);cursor:pointer;color:var(--ink)}
.trs{display:flex;flex-wrap:wrap;gap:6px}
.enemy{padding:10px 12px;display:grid;gap:6px}
.en-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.en-name{font-family:var(--f-disp);font-weight:700;font-size:18px}
.intents{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.it-l{font-size:11.5px;color:var(--ink-2);letter-spacing:.06em}
.it{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.it-atk,.it-spit{color:var(--hp)}.it-gust,.it-quake,.it-snipe,.it-suck{color:var(--warn)}.it-damp,.it-dust,.it-bag{color:var(--ink-2)}.it-block,.it-str{color:var(--info)}
.en-desc{margin:0;font-size:12px;color:var(--ink-2);line-height:1.5}
.enemy.hit{animation:shake .35s}
.msg{margin:0;min-height:36px;font-size:12.5px;color:var(--ink-2);text-align:center;line-height:1.45;text-wrap:balance}
.tower{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 12px;position:relative}
.tower::after{content:"";position:absolute;left:3%;right:3%;bottom:3px;height:3px;border-radius:2px;background:var(--ink-2);opacity:.35}
.row{display:flex;gap:6px;justify-content:center}
.slot,.tw{position:relative;width:var(--cw);height:var(--ch);padding:0;border-radius:8px;flex:0 0 auto}
.slot{appearance:none;border:1.5px dashed var(--slot);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-2)}
.slot .mx{font-family:var(--f-disp);font-weight:700;font-size:15px;opacity:.6}
.slot.ok{border:2px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.slot.ok .mx{opacity:1;color:var(--accent)}
.slot .pv{font-weight:700;font-size:12px}
.slot.no{opacity:.4}
.slot.crown{border-color:var(--gold)}.slot.crown .mx{color:var(--gold);opacity:.9}
.tw{appearance:none;border:0;background:none;cursor:pointer}
.tw.foc .card{outline:2.5px solid var(--hp);outline-offset:1px}
.tag{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn);color:var(--warn-ink);white-space:nowrap;z-index:2;pointer-events:none}
.card{position:relative;display:block;width:var(--w,66px);height:var(--h,90px);box-sizing:border-box;background:var(--paper);border:1px solid var(--paper-edge);border-radius:7px;color:var(--suit-black);box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 12px -8px rgba(15,25,60,.55);overflow:hidden;text-align:left}
.tw .card{--w:var(--cw);--h:var(--ch)}
.card.red{color:var(--suit-red)}
.card.joker{color:var(--joker)}
.card.dust{background:var(--dust-bg);color:var(--dust-ink)}
.card.up{border-color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold),0 6px 12px -8px rgba(15,25,60,.55)}
.card .cor{position:absolute;left:5px;top:3px;display:flex;flex-direction:column;align-items:center;line-height:1}
.card .rk{font-family:var(--f-disp);font-weight:700;font-size:calc(var(--w,66px) * .27)}
.card .st{font-size:calc(var(--w,66px) * .2)}
.card .pip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--w,66px) * .5);opacity:.13;pointer-events:none;font-family:var(--f-disp)}
.card .cost{position:absolute;right:4px;top:4px;width:17px;height:17px;border-radius:50%;background:var(--on-paper);color:var(--paper);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.card .mb{position:absolute;right:3px;top:3px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:10.5px;border-radius:9px;padding:1px 5px;font-variant-numeric:tabular-nums}
.card .dd{position:absolute;right:3px;top:calc(var(--w,66px) * .34);width:calc(var(--w,66px) * .36);height:calc(var(--w,66px) * .36);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:var(--f-hand);font-size:calc(var(--w,66px) * .23);line-height:1;color:var(--ddc);border:2px solid var(--ddc);border-radius:48% 52% 44% 56%/56% 44% 52% 48%;transform:rotate(-9deg);background:rgba(255,255,255,.55);z-index:1}
.dd-bomb{--ddc:var(--dd-bomb)}.dd-wing{--ddc:var(--dd-wing)}.dd-crown{--ddc:var(--dd-crown)}.dd-spring{--ddc:var(--dd-spring)}.dd-twin{--ddc:var(--dd-twin)}.dd-clone{--ddc:var(--dd-clone)}
.ddl{display:inline-block;font-family:var(--f-hand);font-size:15px;color:var(--ddc);background:var(--paper);border:1.5px solid var(--ddc);border-radius:7px;padding:0 5px;margin:0 2px;line-height:1.35}
.card .nm{position:absolute;left:4px;right:4px;top:45%;font-size:10.5px;letter-spacing:-.02em;font-weight:700;color:var(--on-paper);line-height:1.25;text-align:center}
.card .fx{position:absolute;left:3px;right:3px;bottom:4px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--on-paper);font-weight:700;font-size:10.5px;line-height:1.2;text-align:center}
.card .fx span{background:rgba(42,47,61,.07);border-radius:4px;padding:0 3px}
.grid.big .card{--w:96px;--h:150px}
.grid.big .card .fx{font-size:10.5px}
.hand{display:flex;gap:6px;min-height:calc(var(--hh) + 14px);align-items:flex-end;overflow-x:auto;padding:10px 2px 4px}
.hand>:first-child{margin-left:auto}.hand>:last-child{margin-right:auto}
.hc{appearance:none;border:0;padding:0;background:none;cursor:pointer;flex:0 0 auto;transition:transform .15s;border-radius:8px}
.hand .card{--w:var(--hw);--h:var(--hh)}
.hc.sel{transform:translateY(-9px)}
.hc.sel .card{outline:2.5px solid var(--accent);outline-offset:1px}
.hc.dim .card{filter:grayscale(.7);opacity:.5}
.empty{margin:auto;color:var(--ink-2);font-size:12.5px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.acts{display:flex;justify-content:center;gap:5px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.pip-a{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);box-sizing:border-box}.pip-a.on{background:var(--accent)}
.piles{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.fl{font-size:12px;color:var(--ink-2)}
.float{position:fixed;z-index:50;pointer-events:none;font-family:var(--f-hand);font-size:24px;transform:translate(-50%,0);animation:rise .95s ease-out forwards;text-shadow:0 0 4px var(--sheet),0 0 8px var(--sheet);white-space:nowrap}
.float.d{color:var(--hp)}.float.h{color:var(--heal)}.float.g{color:var(--info)}.float.b{color:var(--warn)}
.banner{position:fixed;left:50%;top:38vh;z-index:60;font-family:var(--f-disp);font-weight:700;font-size:30px;padding:10px 24px;border-radius:12px;background:var(--gold);color:var(--gold-ink);animation:ban 1.05s ease-out forwards;white-space:nowrap;pointer-events:none}
.banner.hot{font-family:var(--f-hand);font-weight:400;font-size:34px;background:var(--hp);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--cloth);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100vw - 48px);text-align:center;animation:toast 2.4s ease forwards;pointer-events:none}
.boomfx{position:fixed;z-index:55;pointer-events:none;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--boom) 0 28%,var(--boom-2) 46%,transparent 70%);animation:burst .6s ease-out forwards}
.onoma{position:fixed;z-index:56;pointer-events:none;font-family:var(--f-hand);font-size:28px;color:var(--hp);animation:onoma .95s ease-out forwards;text-shadow:0 0 3px var(--sheet),0 0 7px var(--sheet);white-space:nowrap}
.falling{animation:fall .62s cubic-bezier(.45,0,.8,.5) forwards}
.flying{animation:fly .75s cubic-bezier(.3,.2,.6,1) forwards}
.sucked{animation:suck .6s ease-in forwards}
.saved{animation:saved .55s}
.pop{animation:pop .32s ease-out}
.crowning .tw .card{animation:glow 1.05s ease-in-out}
.deal .hc{animation:deal .36s ease-out backwards;animation-delay:calc(var(--i) * 55ms)}
#app.jolt{animation:jolt .45s}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}to{opacity:0;transform:translate(-50%,-38px)}}
@keyframes ban{from{opacity:0;transform:translate(-50%,10px) scale(.92)}20%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}to{opacity:0;transform:translate(-50%,-6px)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}to{opacity:0}}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
@keyframes onoma{from{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1.15)}to{opacity:0;transform:translate(-50%,-95%) rotate(-10deg) scale(1)}}
@keyframes fall{to{transform:translateY(72px) rotate(28deg);opacity:0}}
@keyframes fly{30%{transform:translateY(-34px) rotate(-120deg)}to{transform:translateY(110px) rotate(-300deg);opacity:0}}
@keyframes suck{to{transform:translateY(-190px) scale(.15) rotate(220deg);opacity:0}}
@keyframes saved{50%{transform:scale(1.07);filter:drop-shadow(0 0 7px var(--warn))}}
@keyframes pop{from{transform:translateY(-16px) scale(1.08)}}
@keyframes glow{45%{box-shadow:0 0 0 2px var(--gold),0 0 18px 5px var(--gold)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes jolt{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes deal{from{opacity:0;transform:translateY(26px)}}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,14,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:86%;overflow:auto;background:var(--sheet);color:var(--ink);border-radius:16px 16px 0 0;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.help{margin:0;padding-left:1.3em;display:grid;gap:8px;line-height:1.65;font-size:13.5px}
.suits{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-weight:700;font-size:13.5px}
.suits .r{color:var(--hp)}
.scr{padding:16px;display:grid;gap:10px}
.kicker{margin:0;font-size:12px;letter-spacing:.12em;color:var(--ink-2)}
.h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:22px;text-wrap:balance}
.text{margin:0;line-height:1.75;font-size:14px}
.sub{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.res{margin:0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-weight:700;line-height:1.6}
.choices{display:grid;gap:8px}
.grid{display:flex;flex-wrap:wrap;gap:12px 10px;justify-content:center}
.price{display:block;margin-top:5px;font-size:12px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.price.short{color:var(--hp)}
.hc:disabled{cursor:default;opacity:.4}
.list{display:grid;gap:8px}
.row-btn{appearance:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--panel-edge);background:transparent;cursor:pointer;color:var(--ink)}
.row-btn b{grid-column:1}.row-btn span{grid-column:1;font-size:12px;color:var(--ink-2)}.row-btn em{grid-column:2;grid-row:1 / 3;align-self:center;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.row-btn:disabled{opacity:.45;cursor:default}
.mapp{padding:14px 12px;display:grid;gap:8px}
.mapwrap{display:grid;grid-template-columns:74px minmax(0,1fr);gap:0 6px}
.lbls{display:grid;grid-template-rows:repeat(8,60px)}
.lbls span{align-self:center;font-size:11.5px;color:var(--ink-2);line-height:1.3}
.lbls b{font-family:var(--f-disp);color:var(--ink);font-size:14px}
.lanes{position:relative}
.lanes svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lanes line{stroke:var(--ink-2);stroke-opacity:.35;stroke-width:2;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.lanes line.on{stroke-opacity:.85;stroke-dasharray:none}
.node{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:2px solid var(--ink-2);background:var(--panel);font-family:var(--f-disp);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.node.av{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;animation:pulse 1.4s infinite}
.node.done{background:var(--ink-2);border-color:var(--ink-2);color:var(--sheet)}
.node.lock{opacity:.55}
.node.cur{box-shadow:0 0 0 3px var(--gold)}
.node.boss{width:52px;height:52px;font-size:21px}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--accent-soft)}}
.legend{margin:0;font-size:11.5px;color:var(--ink-2);text-align:center;line-height:1.6;text-wrap:balance}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:24px}
.title h1{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(40px,13vw,58px);letter-spacing:.06em;line-height:1.1}
.ruby{font-size:11.5px;letter-spacing:.42em;color:var(--ink-2);margin-bottom:4px}
.tagline{margin:0;font-family:var(--f-hand);font-size:22px;color:var(--hp);transform:rotate(-2deg)}
.story{margin:0;max-width:26em;font-size:13.5px;line-height:1.85;color:var(--ink-2)}
.tbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.meta{margin:0;font-size:12px;color:var(--ink-2)}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:10px;position:relative}
.mini::after{content:"";position:absolute;bottom:0;width:200px;height:3px;border-radius:2px;background:var(--ink-2);opacity:.35}
.mini .row{gap:6px}
.cb{display:block;width:38px;height:52px;border-radius:5px;box-sizing:border-box;padding:3px;background:var(--paper);border:1px solid var(--paper-edge);box-shadow:0 5px 10px -6px rgba(15,25,60,.6);animation:stack .45s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:calc(var(--i) * 80ms)}
.cb::before{content:"";display:block;height:100%;border-radius:3px;background:repeating-linear-gradient(45deg,var(--back-a) 0 1.5px,transparent 1.5px 6px),repeating-linear-gradient(-45deg,var(--back-a) 0 1.5px,transparent 1.5px 6px),var(--back-b)}
.cb.top{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 6px 14px -4px var(--gold)}
.cb.tilt{transform:rotate(14deg) translate(4px,-3px)}
@keyframes stack{from{opacity:0;transform:translateY(-28px) rotate(-8deg)}}
.endh{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(30px,9vw,40px);text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;width:100%;max-width:400px}
.stats div{background:var(--panel);border:1px solid var(--panel-edge);border-radius:10px;padding:8px 4px}
.stats dt{font-size:11px;color:var(--ink-2)}.stats dd{margin:2px 0 0;font-family:var(--f-disp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
/* v3 additions: meta progress, troupe select, encyclopedia, chapter labels */
.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.it-heal{color:var(--heal)}.it-scramble,.it-chill{color:var(--warn)}
.chap{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.tbtns.sub{gap:2px 14px;margin-top:-6px}
.memo{width:100%;max-width:400px;box-sizing:border-box;padding:10px 14px;display:grid;gap:6px;text-align:left}
.memo b{font-family:var(--f-disp);font-size:15px}
.prog{height:8px;border-radius:5px;background:var(--slot);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--gold);border-radius:5px;transition:width .5s}
.row-btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.lvbox{display:grid;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--panel-edge)}
.lvrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvrow b{font-family:var(--f-disp);font-size:17px}
.lvrow .btn{min-width:48px;padding:6px 0;font-size:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--ink-2);border-radius:999px;padding:6px 14px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.grid.dex{gap:8px}
.grid.dex .card{--w:60px;--h:84px}
.grid.dex .card .fx{font-size:9.5px}
.card.unk{--w:60px;--h:84px;background:transparent;border:1.5px dashed var(--slot);box-shadow:none;color:var(--ink-2)}
.card.unk .pip{opacity:.55;font-size:24px}
.dexlist{display:grid;gap:6px}
.dexlist div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;border-radius:9px;border:1px solid var(--panel-edge)}
.dexlist b{font-size:13.5px}
.dexlist em{grid-column:2;grid-row:1;font-style:normal;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.dexlist span{grid-column:1 / -1;font-size:12px;color:var(--ink-2);line-height:1.55}
.unl{margin:0;width:100%;max-width:400px;box-sizing:border-box;padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-weight:700;font-size:13px;line-height:1.7}
.title .endh{font-size:clamp(28px,8.5vw,38px);letter-spacing:.02em}
.toast{width:max-content}
/* v4: 遊び道具 */
.card .cost.free{background:var(--gold);color:var(--gold-ink)}
.slot .tp{font-size:10.5px;font-weight:700;color:var(--hp);line-height:1.15;text-align:center;padding:0 2px}
.bstat{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip.hot{color:var(--hp);border-color:var(--hp)}
.chip .rs{color:var(--hp)}
.gsrc{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);margin-left:6px;white-space:nowrap}
.banner.trick{top:44vh;background:var(--accent);color:var(--accent-ink);font-size:26px;box-shadow:0 8px 20px -10px rgba(10,14,28,.6)}
.banner.hot.trick{background:var(--hp)}
.sub.ver{text-align:center;margin-top:-4px}
/* 予備の札: 白紙の札。内側に点線の枠 */
.card.spare::before{content:"";position:absolute;inset:4px;border:1px dashed var(--paper-edge);border-radius:4px;pointer-events:none}
</style>

function canPlace(run,hi,k){const b=run.b,inst=b.hand[hi];if(!inst)return{ok:0,why:'札を選んでいない'};

   if(X.c.kw.bomb){const v=boomVal(run);fx.push({t:'boom',k,v});hitEnemy(run,v,false,fx,'boom');

 if(F.multiply){const src=b.hand.slice();let n=0;for(const h of src)n+=addTemp(run,h);fx.push({t:'clone',n});}

function trackBest(run,fx){const s=fx.reduce((a,f)=>a+(f.t==='dmg'&&f.to==='e'?f.v:0),0);if(s>run.best)run.best=s;return s;}
function placeCard(run,hi,k){const b=run.b,chk=canPlace(run,hi,k);if(!chk.ok)return null;

function checkTricks(run,k,inst,c,m,prev,fx){const b=run.b,here=()=>{const X=b.tower[k];return X&&X.i===inst;};

 if(has(run,'baba')&&c.s==='J'&&!b.lull){b.lull=1;fx.push({t:'trick',n:'ババを押し付けた'});}

const SFX={ctx:null,
 init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C();}catch(e){this.ctx=null;}},
 tone(f,d,type,vol,slide){const c=this.ctx;if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);},
 noise(d,vol,lp){const c=this.ctx;if(!c)return;const n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=lp||900;g.gain.value=vol||.3;s.connect(f);f.connect(g);g.connect(c.destination);s.start();},
 play(k){if(!meta.sound)return;try{this.init();if(!this.ctx)return;if(this.ctx.state==='suspended')this.ctx.resume();
  switch(k){case'place':this.tone(520,.08,'triangle',.12);break;case'fall':this.tone(440,.25,'square',.05,140);break;case'boom':this.noise(.45,.45,700);this.tone(90,.4,'sine',.28,40);break;
   case'crown':[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,.18,'triangle',.11),i*90));break;case'hit':this.tone(160,.18,'sawtooth',.1,70);break;
   case'win':[392,523,659,784].forEach((f,i)=>setTimeout(()=>this.tone(f,.22,'triangle',.12),i*110));break;case'coin':this.tone(988,.07,'square',.06);setTimeout(()=>this.tone(1319,.12,'square',.06),70);break;
   case'flip':this.noise(.6,.4,1200);this.tone(300,.5,'sawtooth',.08,60);break;
   case'trick':[784,988,1175].forEach((f,i)=>setTimeout(()=>this.tone(f,.12,'square',.05),i*60));break;case'suck':this.tone(200,.5,'sawtooth',.07,900);break;case'tap':this.tone(700,.04,'sine',.05);break;}}catch(e){}}};
const HELP=`<ol class="help">
<li><b>目的</b>: 3つの章(子供部屋・台所・居間)を抜けて、居間の掃除機を止める。各章の最後にボスがいる。</li>
<li><b>置く</b>: 手札の札をタップし、光ったマスをタップすると楼閣に積める。置いた瞬間に効果が出る。</li>
<li><b>段の倍率</b>: 1段目×1、2段目×2、3段目×3、天守×4。上ほど効果が大きい。</li>
<li><b>支えと荷重</b>: 2段目より上は真下の2枚が必要。置く札のランク(A=1、J=11、Q=12、K=13)は、支え2枚の合計以下にする。支えに同じスートがあれば倍率+1(共鳴)。</li>
<li><b>崩落も攻撃</b>: 塔から落ちた札は敵に当たり、落ちた段の倍率×2のダメージを与える。支えを失った上の札も一緒に落ちる。</li>
<li><b>爆発</b>: 爆発する札は落ちると敵に15ダメージを与え、両隣と真上の札を吹き飛ばす。誘爆もする。</li>
<li><b>崩す</b>: 塔の札をタップして「崩す」(手数1)。わざと崩して、塔ごと敵にぶつけられる。</li>
<li><b>楼閣完成</b>: 10マスを埋めると全札がもう一度発動し、塔はそのまま敵の上に崩れ落ちる。</li>
<li><b>落書き</b>: クレヨンの落書きは札の性質を変える。${ddChip('bomb')}爆弾 ${ddChip('wing')}浮遊 ${ddChip('crown')}倍率×2 ${ddChip('spring')}ばね ${ddChip('twin')}2回発動 ${ddChip('clone')}分身</li>
<li><b>ボタン</b>: 戦闘やイベントで手に入る。店では札やガラクタを買えるほか、デッキの札を売ってボタンに換えられる。</li>
<li><b>遊び道具</b>: ガラクタの中には、ポーカーの役、ブラックジャック、大富豪の革命、花札の役など、別のカードゲームのルールを持ち込むものがある。置けるマスに役の名前が出たら、そこに置くと発動する。一座を選ぶ画面の「ハチャメチャ箱」をオンにすると、最初から2つ持って出発できる。</li>
<li><b>思い出</b>: 1回の挑戦が終わるたびにたまり、新しい一座・札・ガラクタが解放される。クリアすると次の大掃除レベルに挑める。</li>
</ol>
<p class="suits"><span>♠ 攻撃</span><span class="r">♦ 守り</span><span>♣ 補強</span><span class="r">♥ 回復</span><span>★ ジョーカー</span></p>`;

 const lines=fxLines(c,o.small?0:o.big?2:1).slice(0,o.small?2:o.big?4:3);const rk=c.s==='J'?'★':RANKN(c.r);
 return`<span class="${cls}"><span class="cor"><span class="rk">${rk}</span><span class="st">${c.s==='J'||c.s==='X'?'':su.sym}</span></span>`+
  (o.mult?`<span class="mb">×${o.mult}</span>`:`<span class="cost${o.cost!=null&&o.cost<c.cost?' free':''}">${o.cost!=null?o.cost:c.cost}</span>`)+
  `<span class="pip">${c.s==='X'?(c.kw.spare?'予':'塵'):c.s==='J'?'★':su.sym}</span>`+

function preview(run,c,k,m){const b=run.b,F=c.fx,tc=towerCount(b)+1,r=c.kw.twice?2:1;
 if(c.kw.echo)return b.last?'再演':'空振り';
 if(F.flip){let s=0;for(let i=0;i<10;i++){if(b.tower[i]||i===k)s+=fallDmg(run,i)*3;if(b.tower[i]&&b.tower[i].c.kw.bomb)s+=boomVal(run);}return'落'+s;}
 if(F.mirror)return tierOf(k)>0?'映す':'空振り';if(F.multiply)return'増殖';if(F.shuffle)return'模様替';if(F.det)return'起爆';if(F.swap)return'入替';if(F.lull)return'半減';
 if(F.dmg)return'攻'+F.dmg*m*r;if(F.dmgT)return'攻'+F.dmgT*tc*m*r;if(F.grd)return'守'+F.grd*m*r;if(F.grdT)return'守'+F.grdT*tc*m*r;
 if(F.brc)return'補'+F.brc*m*r;if(F.heal)return'回'+F.heal*m*r;if(F.healT)return'回'+F.healT*tc*m*r;if(F.draw)return'引'+F.draw;return'';}

 if(tab==='e'){body=[1,2,3].map(ch=>`<p class="chap">第${ch}章 ${CHAPTERS[ch].name}</p><div class="dexlist">${Object.keys(ENEMIES).filter(id=>ENEMIES[id].ch===ch).map(id=>{const E=ENEMIES[id];return seen.e.includes(id)?`<div><b>${E.name}</b><em>${E.tier==='boss'?'ボス':E.tier==='elite'?'強敵':'通常'}・HP${E.hp}</em><span>${E.say}</span></div>`:'<div><b>???</b><span>まだ出会っていない</span></div>';}).join('')}</div>`).join('');}

  <div class="dexlist">${TROUPE_ORDER.map(id=>`<div><b>${TROUPES[id].name}</b><em>${troupeOpen(id)?(meta.cleared[id]!=null?'最高クリア Lv'+meta.cleared[id]:'未クリア'):'未解放'}</em></div>`).join('')}${d?`<div><b>今日の挑戦(${d.date})</b><em>${d.won?'クリア':'最高 '+d.best+'階分'}</em></div>`:''}</div>
  <div class="dexlist">${UNLOCKS.map(u=>`<div><b>${u.text}</b><em>${meta.all||meta.total>=u.at?'解放済み':'思い出 '+u.at}</em></div>`).join('')}</div>`;}

function render(){const v={title:vTitle,select:vSelect,map:vMap,battle:vBattle,reward:vReward,shop:vShop,rest:vRest,event:vEvent,treasure:vTreasure,chapter:vChapter,over:vOver,win:vWin}[S.scr];

function toast(t){const s=document.createElement('div');s.className='toast';s.textContent=t;document.body.appendChild(s);setTimeout(()=>s.remove(),2500);}
function banner(t,cls,dy){const s=document.createElement('div');s.className='banner'+(cls?' '+cls:'');s.textContent=t;if(dy)s.style.marginTop=dy+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1100);}
function rectOf(id){const el=document.getElementById(id);return el?el.getBoundingClientRect():null;}
function float(id,text,cls,dx,size){const r=rectOf(id);if(!r)return;const s=document.createElement('span');s.className='float '+cls;s.textContent=text;if(size)s.style.fontSize=size+'px';
 s.style.left=(r.left+r.width/2+(dx||0))+'px';s.style.top=(r.top+Math.min(r.height*.3,40))+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}
function jolt(){app.classList.remove('jolt');void app.offsetWidth;app.classList.add('jolt');}
function dmgFloat(v){if(!v)return;float('enemy','-'+fmt(v)+(v>=100?'!':''),'d',0,Math.round(24+Math.min(32,Math.log10(v+1)*12)));if(v>=40)jolt();}
function onoma(id,word,dy){const r=rectOf(id);if(!r)return;const w=document.createElement('span');w.className='onoma';w.textContent=word;w.style.left=(r.left+r.width/2)+'px';w.style.top=(r.top+r.height/2+(dy||0))+'px';document.body.appendChild(w);setTimeout(()=>w.remove(),1000);}
function boomAt(id,word){const r=rectOf(id);if(!r)return;const b=document.createElement('span');b.className='boomfx';b.style.left=(r.left+r.width/2)+'px';b.style.top=(r.top+r.height/2)+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),650);onoma(id,word);SFX.play('boom');}
function setMsg(t){S.msg=t;const m=document.getElementById('msg');if(m)m.textContent=t;}
const sumFx=(fx,t)=>fx.filter(f=>f.t===t).reduce((s,f)=>s+f.v,0);
const sumE=fx=>fx.filter(f=>f.t==='dmg'&&f.to==='e').reduce((s,f)=>s+f.v,0);
const cnt=(fx,t)=>fx.filter(f=>f.t===t).length;
function showFloats(ph){const d=sumE(ph),h=sumFx(ph,'heal'),g=sumFx(ph,'grd'),br=sumFx(ph,'brc');
 if(d)dmgFloat(d);if(h)float('hud','+'+h,'h',-60);if(g)float('hud','守り+'+g,'g',40);if(br)float('hud','補強+'+br,'b',110);}
function animateFalls(fx){let i=0,su=0;
 for(const f of fx){
  if(f.t==='fall'||f.t==='suck'){const el=document.getElementById('s'+f.k);if(el){el.style.animationDelay=(i*70)+'ms';el.classList.add(f.t==='suck'?'sucked':f.why==='flip'?'flying':'falling');}i++;if(f.t==='suck')su++;}
  if(f.t==='boom'){const id=f.inside?'enemy':'s'+f.k,w=f.inside?'ボフッ!':'ドカン!';setTimeout(()=>boomAt(id,w),i*70);}}
 if(su)SFX.play('suck');else if(i)SFX.play('fall');
 return i;}
function phaseSplit(fx){const iC=fx.findIndex(f=>f.t==='crown'),iF=fx.findIndex(f=>f.t==='fall'),iS=fx.findIndex(f=>f.t==='flip');
 const cut=[iC,iF,iS].filter(i=>i>=0),first=cut.length?Math.min(...cut):fx.length;
 return{pre:fx.slice(0,first),mid:iC>=0?fx.slice(iC,iF>=0?iF:fx.length):[],post:iF>=0?fx.slice(iF):[]};}
function placeMsg(fx){const p=fx[0],{pre,mid,post}=phaseSplit(fx),out=[];
 const d=sumE(pre),g=sumFx(pre,'grd'),br=sumFx(pre,'brc'),h=sumFx(pre,'heal'),bl=sumFx(pre,'blocked'),wk=sumFx(pre,'weak');
 if(d||bl)out.push(fmt(d)+'ダメージ'+(bl?`(防御で${bl}減)`:''));if(g)out.push('守り+'+g);if(br)out.push('補強+'+br);if(h)out.push('回復'+h);if(wk)out.push('弱体+'+wk);
 if(pre.some(f=>f.t==='lull'))out.push('このターン受けるダメージ半分');
 const cl=pre.filter(f=>f.t==='clone').reduce((s,f)=>s+f.n,0);if(cl)out.push('手札が'+cl+'枚増えた');
 if(pre.some(f=>f.t==='swap'))out.push('手札を入れ替えた');
 if(pre.some(f=>f.t==='mirror'))out.push('下の2枚を映した');if(pre.some(f=>f.t==='shuffle'))out.push('模様替えで全札が再発動');
 const m=pre.find(f=>f.t==='msg');if(m)out.push(m.s);
 if(p.free)out.push('ストップウォッチでコスト0');
 let s=`${label(p.c)}を${p.k===9?'天守':(tierOf(p.k)+1)+'段目'}へ(×${p.m}${p.parts.length?'・'+p.parts.join('・'):''})`+(out.length?':'+out.join('、'):'');
 const tp=pre.filter(f=>f.t==='trick');if(tp.length)s+='。'+tp.map(f=>f.n).join('!')+'!';
 if(mid.length){s+=`。楼閣完成!再発動で ${fmt(sumE(mid))}ダメージ`;const tm=mid.filter(f=>f.t==='trick');if(tm.length)s+=`(${tm.map(f=>f.n+(f.v?` +${f.v}`:'')).join('、')})`;const dd=mid.find(f=>f.t==='doodle');if(dd)s+=`。クレヨンで${dd.c}に「${DOODLES[dd.dd].n}」`;}
 const flip=fx.some(f=>f.t==='flip'),det=fx.some(f=>f.t==='det');if(flip)s+='。ちゃぶ台返し!';if(det)s+='。起爆!';
 if(post.length){const n=cnt(post,'fall'),bm=cnt(post,'boom');s+=`${mid.length?'、':(flip||det)?'':'。'}${n}枚が崩れ落ちて ${fmt(sumE(post))}ダメージ`+(bm?`(爆発${bm}回)`:'');}
 return s;}
function demoMsg(fx,X){const n=cnt(fx,'fall'),bm=cnt(fx,'boom'),sp=cnt(fx,'spring');
 return`${label(X.c)}を${fx.some(f=>f.t==='trick')?'メンコで叩きつけて':''}崩した。${n}枚が落ちて ${fmt(sumE(fx))}ダメージ`+(bm?`(爆発${bm}回)`:'')+(sp?`。${sp}枚がばねで手札に戻った`:'')+'。';}
function enemyMsg(fx){const p=[],d=fx.filter(f=>f.t==='dmg'&&f.to==='p');
 if(d.length){const v=d.reduce((s,f)=>s+f.v,0),bl=d.reduce((s,f)=>s+f.blocked,0);p.push(v+'ダメージを受けた'+(bl?`(守りで${bl}防いだ)`:''));}
 const sp=fx.find(f=>f.t==='spit');if(sp)p.push('吸い込まれた札'+sp.n+'枚が飛んできた');
 const su=cnt(fx,'suck');if(su)p.push('札が'+su+'枚吸い込まれた');
 if(fx.some(f=>f.t==='scramble'))p.push('塔の札がかき回された');
 const fl=cnt(fx,'fall'),ed=sumE(fx);if(fl)p.push('札が'+fl+'枚落ちた'+(ed?`。落ちた札が敵に当たって${fmt(ed)}ダメージ`:''));else if(ed)p.push('敵に'+fmt(ed)+'ダメージ');
 const bm=fx.filter(f=>f.t==='boom');if(bm.some(b=>b.inside))p.push('吸い込まれた爆弾が中で爆発した');else if(bm.length)p.push('爆発'+bm.length+'回');
 const sv=fx.filter(f=>f.t==='save'),sb=sv.filter(s=>s.by==='brace').length;
 if(sb)p.push('補強で'+sb+'回防いだ');if(sv.some(s=>s.by==='tape'))p.push('テープで1回防いだ');if(sv.some(s=>s.by==='steady'))p.push('不動の札は動かない');
 if(cnt(fx,'spring'))p.push('ばねの札が手札に戻った');
 for(const f of fx){if(f.t==='damp')p.push('湿気で補強が'+f.v+'消えた');if(f.t==='eblk')p.push('敵が防御'+f.v);if(f.t==='estr')p.push('敵の攻撃が+'+f.v);if(f.t==='eheal')p.push('敵がHPを'+f.v+'回復した');if(f.t==='chill')p.push('指がかじかんで、次のターンの手数が'+f.v+'減る');if(f.t==='dust')p.push('ホコリが'+f.v+'枚混ざった');if(f.t==='msg')p.push(f.s);}
 return(p.join('。')||'敵は様子をうかがっている')+'。';}
function saveRun(){if(S.run&&S.scr==='map'){store.set(KEY_RUN,S.run);shelfMark(true);}}
function endRun(won){const r=S.run,before=unlockedList().map(u=>u.text),mem=memOf(r);
 meta.total+=mem;meta.runs++;meta.best=Math.max(meta.best||0,r.best||0);let lvUp=0,daily='';
 if(won){meta.wins++;meta.cleared[r.troupe]=Math.max(meta.cleared[r.troupe]??-1,r.lv);if(!r.daily&&r.lv>=meta.maxLv&&meta.maxLv<10){meta.maxLv=r.lv+1;lvUp=meta.maxLv;}}
 if(r.daily){const sc=(r.ch-1)*8+r.floor,same=meta.daily&&meta.daily.date===r.daily;meta.daily={date:r.daily,best:Math.max(same?meta.daily.best:0,sc),won:!!(won||(same&&meta.daily.won))};daily=won?'クリア!':`第${r.ch}章の${r.floor}階まで(最高 ${meta.daily.best}階分)`;}
 saveMeta();store.del(KEY_RUN);shelfMark(false);const after=unlockedList().map(u=>u.text);S.end={mem,unl:after.filter(t=>!before.includes(t)),lvUp,daily};}
function toMap(t){S.scr='map';S.ctx=null;S.ov=null;S.msg='';seeRun();saveRun();render();window.scrollTo(0,0);if(t)toast(t);}
function openPick(title,sub,insts,prev,cb,lab){S.ov={mode:'pick',title,sub,pick:1,cb,cards:sortInsts(insts).map(x=>({u:x.u,c:cdata(prev?prev(x):x),lab:lab?lab(x):''}))};render();}
function openRelics(title,sub,ids,cb){S.ov={mode:'relics',title,sub,ids,cb};render();}
function openView(title,insts){S.ov={mode:'view',title,pick:0,cards:sortInsts(insts).map(x=>({u:x.u,c:cdata(x)}))};render();}
function startRun(seed,o,msg){S.run=newRun(seed,o);S.ov=null;S.sel=-1;S.focus=-1;S.end=null;toMap(msg);}
function enterNode(f,i){const run=S.run,n=run.map.fl[f][i];run.floor=f;run.node=i;n.done=1;S.msg='';S.sel=-1;S.focus=-1;window.scrollTo(0,0);
 if(n.t==='battle'||n.t==='elite'||n.t==='boss'){const eid=pickEnemy(run,n.t,f),b=startBattle(run,eid,f);startTurn(run);see('e',[eid]);S.scr='battle';
  S.msg=ENEMIES[eid].say+(b.spare?` デッキが${MIN_DECK}枚に足りないので、この戦闘だけ予備の札を${b.spare}枚足した。`:'')+(b.tarot?` タロットは「${TAROT[b.tarot].n}」: ${TAROT[b.tarot].d}。`:'')+(b.trump?` 切り札は${SUIT[b.trump].sym}。`:'')+(b.bet?` ${b.bet}ボタンを賭けた。`:'');S.deal=1;render();S.deal=0;
  if(n.t==='boss')banner(run.ch===3?'最終戦':'第'+run.ch+'章 ボス');if(!store.get(KEY_TUT)){store.set(KEY_TUT,1);S.ov={mode:'help'};render();}return;}
 if(n.t==='rest')S.scr='rest';
 else if(n.t==='shop'){S.ctx=genShop(run);see('c',S.ctx.cards.map(x=>x.d));see('r',S.ctx.trs.map(x=>x.id));S.scr='shop';if(S.ctx.bonus)SFX.play('coin');}
 else if(n.t==='event'){const left=EVENTS.filter(e=>!run.seen.includes(e.id)),ev=pick(run.rng,left.length?left:EVENTS);run.seen.push(ev.id);S.ctx={id:ev.id,res:'',dd:randDoodle(run)};S.scr='event';}
 else if(n.t==='treasure'){const t=randTrinket(run);if(t){run.tr.push(t);see('r',[t]);}else run.btn+=30;S.ctx={tr:t};S.scr='treasure';}
 render();}
async function doPlace(k){const run=S.run,b=run.b;S.busy=true;S.focus=-1;const fx=placeCard(run,S.sel,k);S.sel=-1;if(!fx){S.busy=false;render();return;}
 const{pre,mid,post}=phaseSplit(fx),snapE=fx.find(f=>f.snap),flip=fx.some(f=>f.t==='flip');S.msg=placeMsg(fx);
 if((post.length||mid.length)&&snapE)S.snap=snapE.snap;
 SFX.play('place');render();const el=document.getElementById('s'+k);if(el)el.classList.add('pop');showFloats(pre);
 const tp=pre.filter(f=>f.t==='trick');for(let i=0;i<tp.length;i++){await wait(i?520:260);banner(tp[i].n+'!',tp[i].hot?'hot trick':'trick',(i%3)*62);SFX.play('trick');}
 if(mid.length){await wait(380);S.crowning=1;render();banner('楼閣完成!');SFX.play('crown');showFloats(mid);await wait(950);
  for(const t of mid.filter(f=>f.t==='trick')){banner(t.n+(t.v?` +${t.v}`:'')+'!','trick',62);SFX.play('trick');await wait(760);}
  S.crowning=0;render();}
 if(flip){await wait(260);banner('ちゃぶ台返し!','hot');SFX.play('flip');}
 if(post.length){await wait(mid.length?120:flip?200:320);const n=animateFalls(post);showFloats(post);if(n>=4)onoma('tower','崩落×'+n+'!',-30);await wait(560+Math.min(n,10)*70);}
 S.snap=null;S.busy=false;render();if(b.over==='win')winBattle();}
async function doDemolish(){const run=S.run,b=run.b,k=S.focus,X=b.tower[k];if(!X)return;if(b.act<1)return toast('手数が足りない');
 S.busy=true;S.focus=-1;const fx=demolish(run,k);if(!fx){S.busy=false;render();return;}
 const n=animateFalls(fx);showFloats(fx);if(n>=4)onoma('tower','崩落×'+n+'!',-30);
 if(fx.some(f=>f.t==='trick'))banner('メンコ!','hot trick');
 setMsg(demoMsg(fx,X));await wait(560+Math.min(n,10)*70);S.busy=false;render();if(b.over==='win')winBattle();}
async function doEndTurn(){const run=S.run,b=run.b;S.busy=true;S.sel=-1;S.focus=-1;
 document.querySelectorAll('.hc.sel').forEach(x=>x.classList.remove('sel'));
 const fx=endTurn(run);const en=document.getElementById('enemy');if(en)en.classList.add('hit');
 fx.filter(f=>f.t==='save').forEach(s=>{const el=document.getElementById('s'+s.k);if(el)el.classList.add('saved');});
 const n=animateFalls(fx);if(n>=4)onoma('tower','崩落×'+n+'!',-30);
 const pd=fx.filter(f=>f.t==='dmg'&&f.to==='p').reduce((s,f)=>s+f.v,0);if(pd){float('hud','-'+pd,'d',-60);SFX.play('hit');}
 const ed=sumE(fx);if(ed)dmgFloat(ed);
 const hand=document.getElementById('hand');if(hand)hand.style.opacity='.35';
 setMsg(enemyMsg(fx));await wait(n?700+Math.min(n,10)*60:480);
 if(b.over==='lose'){render();await wait(500);endRun(false);S.scr='over';S.busy=false;render();window.scrollTo(0,0);return;}
 if(b.over==='win'){render();return winBattle();}
 const sfx=startTurn(run);S.deal=1;render();S.deal=0;S.busy=false;
 const sh=sumFx(sfx,'heal');if(sh)float('hud','+'+sh,'h',-60);}
async function winBattle(){S.busy=true;const run=S.run,b=run.b,E=ENEMIES[b.eid];SFX.play('win');banner(E.tier==='boss'?(run.ch===3?'掃除機を止めた!':E.name+'を倒した!'):'勝利');await wait(950);
 if(E.tier==='boss'&&run.ch===3){run.hp=b.hp;run.b=null;run.won=1;run.kills++;run.bosses++;endRun(true);S.scr='win';S.busy=false;render();window.scrollTo(0,0);return;}
 const rw=finishBattle(run);see('c',rw.cards.map(o=>o.d));if(rw.tr)see('r',[rw.tr]);S.ctx=Object.assign({ename:E.name},rw);S.scr='reward';S.busy=false;render();window.scrollTo(0,0);}
function afterReward(t){if(S.ctx&&S.ctx.boss){const run=S.run,trs=trinketChoices(run,3);see('r',trs);S.ctx={trs,heal:chapterHeal(run)};S.scr='chapter';render();window.scrollTo(0,0);if(t)toast(t);return;}toMap(t);}
const ACT={
 noop(){},
 newrun(){const l=meta.last||{};S.pick={troupe:troupeOpen(l.troupe)?l.troupe:'spade',lv:Math.min(l.lv||0,maxLvOpen()),hacha:!!l.hacha};S.ov=null;S.scr='select';render();window.scrollTo(0,0);},
 ptroupe(d){S.pick.troupe=d.t;render();},
 phacha(){S.pick.hacha=!S.pick.hacha;SFX.play('tap');render();},
 lv(d){S.pick.lv=Math.max(0,Math.min(maxLvOpen(),S.pick.lv+(+d.d)));render();},
 start(){const p=S.pick;meta.last={troupe:p.troupe,lv:p.lv,hacha:!!p.hacha};saveMeta();startRun((Date.now()^Math.floor(Math.random()*1e9))>>>0,Object.assign({troupe:p.troupe,lv:p.lv,hacha:!!p.hacha},locks()),TROUPES[p.troupe].name+'で出発'+(p.hacha?'(ハチャメチャ箱)':''));},
 daily(){const key=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  let h=2166136261;for(const ch of'satsujo'+key){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}const seed=h>>>0,troupe=TROUPE_ORDER[seed%TROUPE_ORDER.length];
  startRun(seed,{troupe,lv:0,daily:key},'今日の挑戦: '+TROUPES[troupe].name+'(全員同じ地図と札)');},
 cont(){const d=store.get(KEY_RUN);if(!d||!d.map||!d.ch)return toast('続きのデータが見つからない');S.run=d;toMap('');},
 home(){S.scr='title';S.ov=null;render();window.scrollTo(0,0);},
 help(){S.ov={mode:'help'};render();},
 dex(){S.ov={mode:'dex',tab:'c'};render();},
 dextab(d){S.ov.tab=d.t;render();},
 dexcard(d){const c=cdata({d:d.d});toast(label(c)+': '+desc(c));},
 settings(){S.wipe=0;S.ov={mode:'settings'};render();},
 tog(d){meta[d.k]=!meta[d.k];saveMeta();if(d.k==='sound'&&meta.sound)SFX.play('tap');render();},
 wipe(){if(!S.wipe){S.wipe=1;render();return;}const keep={sound:meta.sound,fast:meta.fast};meta=Object.assign(META0(),keep);saveMeta();store.del(KEY_RUN);store.del('shelf:'+SHELF_ID);S.wipe=0;S.ov=null;S.scr='title';render();toast('記録を消した');},
 close(){S.ov=null;S.wipe=0;render();},
 deck(){openView('デッキ('+S.run.deck.length+'枚)',S.run.deck);},
 tr(d){toast(trText(d.t));},
 tinfo(d){const b=S.run&&S.run.b;if(!b)return;
  if(d.t==='trump')toast(`切り札は${SUIT[b.trump].sym}。${SUIT[b.trump].sym}の札は倍率+1(切り札のしおり)`);
  if(d.t==='tarot')toast(`タロット「${TAROT[b.tarot].n}」: ${TAROT[b.tarot].d}`);
  if(d.t==='rev')toast('革命中: 重さの大小が逆になり、ランク5以下の札の数値が2倍。同じランクを3枚そろえると革命返し');
  if(d.t==='bet')toast(`チップの山: ${b.bet}ボタンを賭けている。4ターン目までに勝てば倍になって戻る`);
  if(d.t==='hana')toast('この戦闘でそろえた役: '+HANA.filter(y=>b.hana[y.id]).map(y=>y.n).join('・')+'。まだの役: '+HANA.filter(y=>!b.hana[y.id]).map(y=>y.n).join('・'));},
 node(d){enterNode(+d.f,+d.i);},
 hand(d){const i=+d.i;S.sel=S.sel===i?-1:i;S.focus=-1;S.msg='';SFX.play('tap');render();},
 slot(d){const k=+d.k,run=S.run,b=run.b;
  if(S.sel>=0){const ck=canPlace(run,S.sel,k);if(ck.ok)return doPlace(k);S.msg=ck.why;render();return;}
  const X=b.tower[k];S.focus=X&&S.focus!==k?k:-1;
  S.msg=X?(S.focus===k?`${label(X.c)}(×${X.m}): ${desc(X.c)}。「崩す」で、この札と上の札を落として敵にぶつけられる(手数1)。`:''):`${k===9?'天守':(tierOf(k)+1)+'段目'}のマス(×${MULT[tierOf(k)]})。手札の札を選んでから置く。`;render();},
 wedge(){const run=S.run,i=S.sel;if(i<0)return;const c=cdata(run.b.hand[i]),fx=wedgeCard(run,i);if(!fx)return;S.sel=-1;S.msg=label(c)+'を楔にした。補強+'+fx[0].v+'。';render();float('hud','補強+'+fx[0].v,'b',110);},
 demolish(){doDemolish();},
 end(){doEndTurn();},
 pile(d){const b=S.run.b;if(d.p==='draw')openView('山札('+b.draw.length+'枚・順番は伏せてある)',b.draw);else openView('捨て札('+b.disc.length+'枚)',b.disc);},
 take(d){const o=S.ctx.cards[+d.i];addCard(S.run,o.d,0,o.dd);afterReward(label(offerC(o))+'をデッキに加えた');},
 skip(){afterReward('札は見送った');},
 chtr(d){const run=S.run,i=+d.i,id=i>=0?S.ctx.trs[i]:null;const heal=nextChapter(run,id);toMap(`第${run.ch}章「${CHAPTERS[run.ch].name}」へ`+[heal?'HP+'+heal:'',id?TRINKETS[id].name+'を手に入れた':''].filter(Boolean).map(s=>'・'+s).join(''));},
 buy(d){const c=S.ctx,x=c.cards[+d.i],run=S.run;if(run.btn<x.p)return toast('ボタンが足りない');run.btn-=x.p;x.sold=1;addCard(run,x.d,0,x.dd);SFX.play('coin');render();toast(label(offerC(x))+'を買った');},
 buytr(d){const c=S.ctx,x=c.trs[+d.i],run=S.run;if(run.btn<x.p)return toast('ボタンが足りない');run.btn-=x.p;x.sold=1;run.tr.push(x.id);SFX.play('coin');render();toast(TRINKETS[x.id].name+'を買った');},
 ddsvc(){const c=S.ctx,run=S.run;if(run.btn<c.ddP)return toast('ボタンが足りない');const cand=run.deck.filter(canDoodle);if(!cand.length)return toast('落書きできる札がない');
  openPick('落書きしてもらう札を選ぶ','「'+DOODLES[c.dd].n+'」: '+DOODLES[c.dd].d+'。',cand,x=>({u:x.u,d:x.d,up:x.up,dd:c.dd}),u=>{if(doodleCard(run,u,c.dd)){run.btn-=c.ddP;c.ddUsed=1;toast('「'+DOODLES[c.dd].n+'」の落書きを描いてもらった');}});},
 sellsvc(){const c=S.ctx,run=S.run;if(run.deck.length<=MIN_DECK)return toast(`デッキは${MIN_DECK}枚より減らせない`);
  openPick('売る札を選ぶ',`札の下に買い取り値を表示している。売ったあとも店に残れる(デッキは${MIN_DECK}枚まで)。`,run.deck,null,u=>{const x=run.deck.find(q=>q.u===u),nm=x?label(cdata(x)):'',p=sellCard(run,u);if(p<0)return toast(`デッキは${MIN_DECK}枚より減らせない`);c.soldN++;c.earned+=p;SFX.play('coin');toast(`${nm}を${p}ボタンで売った`);},x=>'+'+sellPrice(x)+'ボタン');},
 rest(){const run=S.run,h=restHeal(run);run.hp+=h;toMap('HPが'+h+'回復した');},
 iron(){const run=S.run;openPick('アイロンをかける札を選ぶ','強化したあとの効果を表示している。',run.deck.filter(canUpgrade),x=>({u:x.u,d:x.d,up:1,dd:x.dd}),u=>{upgradeCard(run,u);const x=run.deck.find(q=>q.u===u);toMap(label(cdata(x))+'になった');});},
 choose(d){const c=S.ctx,ev=EVENTS.find(x=>x.id===c.id),ch=ev.ch[+d.i],run=S.run;
  if(ch.pickUp){const ups=run.deck.filter(canUpgrade);if(!ups.length){c.res='乾かす札がなかった。';return render();}
   return openPick('乾かす札を選ぶ','強化したあとの効果を表示している。',ups,x=>({u:x.u,d:x.d,up:1,dd:x.dd}),u=>{upgradeCard(run,u);const x=run.deck.find(q=>q.u===u);c.res=label(cdata(x))+'になった。';});}
  if(ch.pickRemove)return openPick('置いていく札を選ぶ','選んだ札はデッキから消える。',run.deck,null,u=>{c.res=removeCard(run,u)?'札を1枚置いていった。少し身軽になった。':`デッキは${MIN_DECK}枚より減らせない。`;});
  if(ch.pickDoodle){const cand=run.deck.filter(canDoodle);if(!cand.length){c.res='描ける札がなかった。';return render();}
   return openPick('落書きしてもらう札を選ぶ','「'+DOODLES[c.dd].n+'」: '+DOODLES[c.dd].d+'。',cand,x=>({u:x.u,d:x.d,up:x.up,dd:c.dd}),u=>{doodleCard(run,u,c.dd);const x=run.deck.find(q=>q.u===u);c.res=label(cdata(x))+'に「'+DOODLES[c.dd].n+'」の落書きが付いた。';});}
  if(ch.pickMicro)return openPick('チンする札を選ぶ','半々で、強化と王冠の落書き。外れると黒焦げで消える。',run.deck.filter(x=>CARDS[x.d].rar!=='x'),null,u=>{c.res=microwave(run,u);});
  if(ch.pickDup)return openPick('複製する札を選ぶ','同じ札がもう1枚デッキに入る(強化と落書きもそのまま)。HP-6。',run.deck.filter(x=>CARDS[x.d].rar!=='x'),null,u=>{const x=run.deck.find(q=>q.u===u);c.res=dupCard(run,u)?label(cdata(x))+'が鏡から出てきた。':'複製できなかった。';});
  if(ch.pickSell2){if(run.deck.length<=MIN_DECK){c.res=`デッキが${MIN_DECK}枚しかないので、売れる札がなかった。`;return render();}
   return openPick('売る札を選ぶ','いつもの2倍の値段で買い取ってくれる。',run.deck,null,u=>{const x=run.deck.find(q=>q.u===u),nm=x?label(cdata(x)):'',p=sellCard(run,u,2);c.res=p<0?'売れなかった。':`${nm}が${p}ボタンで売れた。`;if(p>=0)SFX.play('coin');},x=>'+'+sellPrice(x,2)+'ボタン');}
  if(ch.pickGame){c.games=c.games||gameChoices(run,3);if(!c.games.length){c.res='箱の中は空っぽだった。';return render();}
   see('r',c.games);return openRelics('遊び道具を1つ選ぶ','選んだら、箱のとげでHPが4減る。',c.games,id=>{run.hp=Math.max(1,run.hp-4);run.tr.push(id);c.res=`「${TRINKETS[id].name}」を持っていくことにした。${TRINKETS[id].desc}。`;});}
  c.res=ch.f(run,c);seeRun();render();},
 pickrelic(d){const o=S.ov;S.ov=null;o.cb(o.ids[+d.i]);seeRun();render();},
 pickcard(d){const o=S.ov;S.ov=null;o.cb(+d.u);seeRun();if(S.scr!=='map')render();},
 next(){toMap('');},
};
